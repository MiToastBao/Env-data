<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>桌遊存檔工具</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bitter:wght@600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#171D18;
    --panel:#212A22;
    --panel-alt:#2A342B;
    --panel-alt2:#333F35;
    --ink:#EDE6D6;
    --ink-dim:#9FB0A2;
    --accent:#C99A3C;
    --accent-soft:rgba(201,154,60,0.16);
    --danger:#B5533C;
    --line:rgba(237,230,214,0.12);
    --map:#6E9BB0;
    --equip:#C99A3C;
    --inv:#7C9473;
    --shop:#B5533C;
    --gm:#8B7BA8;
    --cards:#5E8AA8;
    --safe-b: env(safe-area-inset-bottom, 0px);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse 900px 500px at 50% -10%, rgba(201,154,60,0.06), transparent 60%),
      var(--bg);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    padding-bottom:calc(84px + var(--safe-b));
  }
  .mono{font-family:'JetBrains Mono',monospace;}
  .display{font-family:'Bitter',serif;}
  button{font-family:'Inter',sans-serif; cursor:pointer;}

  /* ---- Top bar ---- */
  header{
    position:sticky; top:0; z-index:20;
    background:rgba(23,29,24,0.92);
    backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);
    padding:14px 16px 12px;
  }
  .session-row{display:flex; align-items:center; gap:10px;}
  .session-row .eyebrow{
    font-family:'JetBrains Mono',monospace;
    font-size:11px; letter-spacing:0.08em; color:var(--accent); text-transform:uppercase;
  }
  #sessionName{
    width:100%;
    background:transparent; border:none; outline:none;
    color:var(--ink); font-family:'Bitter',serif; font-weight:700;
    font-size:20px; padding:2px 0;
    border-bottom:1px solid transparent;
  }
  #sessionName:focus{border-bottom:1px solid var(--accent);}
  .io-row{display:flex; gap:8px; margin-top:10px;}
  .io-btn{
    flex:1; display:flex; align-items:center; justify-content:center; gap:6px;
    background:var(--panel-alt); color:var(--ink); border:1px solid var(--line);
    border-radius:10px; padding:9px 8px; font-size:13px; font-weight:600;
  }
  .io-btn.primary{background:var(--accent-soft); border-color:var(--accent); color:var(--accent);}
  .io-btn:disabled{opacity:0.35;}
  .io-btn svg{width:15px;height:15px;flex-shrink:0;}
  #importInput{display:none;}
  .hint{font-size:11.5px; color:var(--ink-dim); margin-top:8px; line-height:1.5;}

  /* ---- Tabs ---- */
  nav.tabs{
    position:fixed; left:0; right:0; bottom:0; z-index:30;
    display:flex;
    background:rgba(23,29,24,0.97);
    backdrop-filter:blur(10px);
    border-top:1px solid var(--line);
    padding-bottom:var(--safe-b);
  }
  nav.tabs button{
    flex:1; background:none; border:none; color:var(--ink-dim);
    display:flex; flex-direction:column; align-items:center; gap:4px;
    padding:10px 4px 8px; font-size:11px; font-weight:600;
    position:relative;
  }
  nav.tabs button .dot{width:6px;height:6px;border-radius:50%; background:currentColor; opacity:0.35;}
  nav.tabs button.active{color:var(--tab-color, var(--accent));}
  nav.tabs button.active .dot{opacity:1; background:var(--tab-color, var(--accent)); box-shadow:0 0 8px var(--tab-color, var(--accent));}
  nav.tabs button.active::before{
    content:""; position:absolute; top:0; left:20%; right:20%; height:2px;
    background:var(--tab-color, var(--accent));
  }

  /* ---- Content ---- */
  main{padding:16px; max-width:640px; margin:0 auto;}
  .section-title{
    display:flex; align-items:baseline; justify-content:space-between; margin-bottom:12px;
  }
  .section-title h2{
    font-family:'Bitter',serif; font-size:18px; margin:0; font-weight:700;
    color:var(--tab-color, var(--ink));
  }
  .section-title .count{font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--ink-dim);}

  .empty{
    text-align:center; padding:56px 20px; color:var(--ink-dim);
  }
  .empty .glyph{font-size:28px; margin-bottom:10px; opacity:0.6;}
  .empty p{font-size:13.5px; line-height:1.6; margin:0;}

  .card{
    background:var(--panel);
    border:1px solid var(--line);
    border-left:3px solid var(--tab-color, var(--accent));
    border-radius:12px;
    padding:12px;
    margin-bottom:12px;
    display:flex; gap:12px;
  }
  .card img{
    width:76px; height:76px; object-fit:cover; border-radius:8px;
    background:var(--panel-alt); flex-shrink:0;
  }
  .card .no-photo{
    width:76px; height:76px; border-radius:8px; background:var(--panel-alt);
    display:flex; align-items:center; justify-content:center; color:var(--ink-dim); font-size:10px; flex-shrink:0;
  }
  .card-body{flex:1; min-width:0;}
  .card-top{display:flex; align-items:center; gap:8px; margin-bottom:4px; flex-wrap:wrap;}
  .timestamp{font-family:'JetBrains Mono',monospace; font-size:10.5px; color:var(--ink-dim); margin-left:auto;}
  .note{font-size:13.5px; line-height:1.5; color:var(--ink); white-space:pre-wrap; word-break:break-word;}
  .note.empty-note{color:var(--ink-dim); font-style:italic;}
  .card-actions{display:flex; gap:14px; margin-top:8px;}
  .card-actions button{
    background:none; border:none; color:var(--ink-dim); font-size:11.5px;
    display:flex; align-items:center; gap:4px; padding:2px 0;
  }
  .card-actions button.del{color:var(--danger);}
  .card-actions svg{width:13px;height:13px;}

  /* ---- FAB ---- */
  .fab{
    position:fixed; right:18px; bottom:calc(78px + var(--safe-b)); z-index:25;
    width:56px; height:56px; border-radius:50%;
    background:var(--tab-color, var(--accent)); color:#171D18;
    border:none; display:flex; align-items:center; justify-content:center;
    box-shadow:0 6px 18px rgba(0,0,0,0.4);
  }
  .fab svg{width:26px;height:26px;}

  /* ---- Modal / sheet ---- */
  .overlay{
    position:fixed; inset:0; background:rgba(10,13,10,0.72); z-index:50;
    display:none; align-items:flex-end; justify-content:center;
  }
  .overlay.show{display:flex;}
  .sheet{
    background:var(--panel); width:100%; max-width:640px;
    border-radius:18px 18px 0 0; padding:18px 18px calc(18px + var(--safe-b));
    max-height:90vh; overflow-y:auto;
    border-top:1px solid var(--line);
    animation:slideUp 0.22s ease;
  }
  @keyframes slideUp{from{transform:translateY(24px); opacity:0;} to{transform:translateY(0); opacity:1;}}
  .sheet h3{font-family:'Bitter',serif; margin:0 0 14px; font-size:17px; color:var(--tab-color,var(--accent));}
  .field{margin-bottom:14px;}
  .field label{display:block; font-size:11.5px; color:var(--ink-dim); margin-bottom:6px; font-weight:600; letter-spacing:0.02em;}
  .field input[type=text], .field textarea, .field select{
    width:100%; background:var(--panel-alt); border:1px solid var(--line); border-radius:9px;
    padding:10px 11px; color:var(--ink); font-family:'Inter',sans-serif; font-size:14px; outline:none;
  }
  .field input[type=text]:focus, .field textarea:focus{border-color:var(--tab-color,var(--accent));}
  .field textarea{resize:vertical; min-height:70px; line-height:1.5;}

  .photo-input-row{display:flex; gap:8px;}
  .photo-btn{
    flex:1; background:var(--panel-alt); border:1px dashed var(--line); border-radius:10px;
    padding:14px 8px; text-align:center; color:var(--ink-dim); font-size:12px;
  }
  .photo-btn svg{width:20px;height:20px; display:block; margin:0 auto 4px;}
  .photo-preview-wrap{position:relative; margin-top:10px; display:none;}
  .photo-preview-wrap img{width:100%; max-height:220px; object-fit:cover; border-radius:10px;}
  .photo-preview-wrap .remove-photo{
    position:absolute; top:8px; right:8px; background:rgba(10,13,10,0.75);
    border:none; color:var(--ink); width:28px; height:28px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
  }
  input[type=file]{display:none;}

  .sheet-actions{display:flex; gap:10px; margin-top:6px;}
  .btn{
    flex:1; border:none; border-radius:10px; padding:12px; font-size:14px; font-weight:600;
  }
  .btn.cancel{background:var(--panel-alt); color:var(--ink-dim);}
  .btn.save{background:var(--tab-color,var(--accent)); color:#171D18;}
  .btn.ghost{background:none; border:1px solid var(--line); color:var(--ink-dim); flex:none; padding:8px 12px; font-size:12.5px; border-radius:8px;}
  .btn.danger-ghost{background:none; border:1px solid var(--danger); color:var(--danger); flex:none; padding:8px 12px; font-size:12.5px; border-radius:8px;}

  /* lightbox */
  #lightbox{
    position:fixed; inset:0; background:rgba(6,8,6,0.92); z-index:60; display:none;
    align-items:center; justify-content:center; padding:20px;
  }
  #lightbox.show{display:flex;}
  #lightbox img{max-width:100%; max-height:100%; border-radius:8px;}

  .toast{
    position:fixed; bottom:calc(90px + var(--safe-b)); left:50%; transform:translateX(-50%);
    background:var(--panel-alt); border:1px solid var(--accent); color:var(--ink);
    padding:9px 16px; border-radius:20px; font-size:12.5px; z-index:70;
    opacity:0; pointer-events:none; transition:opacity 0.25s;
  }
  .toast.show{opacity:1;}

  /* ---- Equip tab: player list ---- */
  .equip-toolbar{display:flex; justify-content:flex-end; margin-bottom:12px;}
  .player-card{
    background:var(--panel); border:1px solid var(--line); border-left:3px solid var(--equip);
    border-radius:12px; padding:12px; margin-bottom:10px; display:flex; align-items:center; gap:12px;
  }
  .player-card img{width:48px;height:48px;border-radius:8px;object-fit:cover;background:var(--panel-alt);flex-shrink:0;}
  .player-card .avatar-fallback{
    width:48px;height:48px;border-radius:8px;background:var(--panel-alt);flex-shrink:0;
    display:flex;align-items:center;justify-content:center;color:var(--ink-dim); font-family:'Bitter',serif; font-weight:700; font-size:18px;
  }
  .player-card .pname{font-family:'Bitter',serif; font-weight:700; font-size:15.5px;}
  .player-card .psub{font-size:11.5px; color:var(--ink-dim); margin-top:2px;}
  .player-card .chevron{margin-left:auto; color:var(--ink-dim);}

  /* ---- Player detail sheet ---- */
  .pd-photo-row{display:flex; gap:12px; align-items:center; margin-bottom:16px;}
  .pd-photo{width:64px;height:64px;border-radius:10px;object-fit:cover; background:var(--panel-alt); flex-shrink:0;}
  .pd-photo-empty{width:64px;height:64px;border-radius:10px;background:var(--panel-alt); flex-shrink:0; display:flex; align-items:center; justify-content:center; color:var(--ink-dim); font-size:10px; text-align:center;}
  .pd-name-input{
    flex:1; background:var(--panel-alt); border:1px solid var(--line); border-radius:9px;
    padding:10px 11px; color:var(--ink); font-family:'Bitter',serif; font-weight:700; font-size:16px; outline:none;
  }
  .pd-photo-btns{display:flex; flex-direction:column; gap:6px;}
  .pd-photo-btns label{
    font-size:10.5px; background:var(--panel-alt); border:1px solid var(--line); color:var(--ink-dim);
    padding:4px 8px; border-radius:6px; text-align:center;
  }

  .subarea{background:var(--panel-alt); border:1px solid var(--line); border-radius:12px; padding:12px; margin-bottom:12px;}
  .subarea-head{display:flex; align-items:center; gap:8px; margin-bottom:10px;}
  .subarea-head .sa-name{font-family:'Bitter',serif; font-weight:700; font-size:14.5px; color:var(--equip); flex:1;}
  .subarea-head button{background:none; border:none; color:var(--ink-dim); font-size:13px; padding:2px 4px;}
  .subarea-head button.subarea-delete{color:var(--danger);}

  .tagfield{margin-bottom:8px;}
  .tag-chips{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:8px;}
  .tag-chip{
    display:inline-flex; align-items:center; gap:5px;
    background:var(--accent-soft); color:var(--accent); border:1px solid rgba(201,154,60,0.4);
    font-size:12.5px; padding:5px 6px 5px 10px; border-radius:20px;
  }
  .tag-chip .tag-x{background:none; border:none; color:var(--accent); opacity:0.7; font-size:13px; line-height:1; padding:0 2px;}
  .tag-chip .tag-chip-name{cursor:pointer;}
  .tag-chip .tag-chip-name:active{opacity:0.7;}
  .tag-empty{font-size:12px; color:var(--ink-dim); font-style:italic;}
  .tag-add-row{display:flex; gap:6px;}
  .tag-add-row .tag-input{
    flex:1; background:var(--panel-alt2); border:1px solid var(--line); border-radius:8px;
    padding:8px 10px; color:var(--ink); font-size:13px; outline:none;
  }
  .tag-add-row .tag-input:focus{border-color:var(--equip);}
  .tag-add-row .tag-add-btn{background:var(--equip); color:#171D18; border:none; border-radius:8px; padding:0 14px; font-size:12.5px; font-weight:600;}
  .tag-suggest{display:flex; flex-wrap:wrap; gap:6px; margin-top:7px;}
  .tag-suggest .sugg{
    background:var(--panel); border:1px dashed var(--line); color:var(--ink-dim);
    font-size:12px; padding:4px 10px; border-radius:16px;
  }
  .tag-suggest .sugg small{opacity:0.65; font-size:10.5px;}
  .area-note{
    width:100%; margin-top:8px; background:var(--panel-alt2); border:1px solid var(--line); border-radius:8px;
    padding:8px 10px; color:var(--ink); font-size:12.5px; min-height:44px; resize:vertical; outline:none; font-family:'Inter',sans-serif;
  }
  .area-note:focus{border-color:var(--equip);}

  .slot-row{background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:10px; margin-bottom:8px;}
  .slot-row-head{display:flex; align-items:center; gap:8px; margin-bottom:8px;}
  .slot-row-head .slot-name{font-size:13px; font-weight:600; color:var(--ink); flex:1;}
  .slot-row-head button{background:none; border:none; color:var(--ink-dim); font-size:12px; padding:2px 4px;}
  .slot-row-head button.slot-delete{color:var(--danger);}

  .add-slot-btn, .add-subarea-btn{
    width:100%; background:none; border:1px dashed var(--line); color:var(--ink-dim);
    border-radius:9px; padding:10px; font-size:12.5px; margin-top:2px;
  }

  .cat-tabs{display:flex; gap:6px; overflow-x:auto; padding-bottom:6px; margin-bottom:10px; -webkit-overflow-scrolling:touch;}
  .cat-tabs::-webkit-scrollbar{display:none;}
  .cat-tab{
    flex-shrink:0; background:var(--panel-alt2); border:1px solid var(--line); color:var(--ink-dim);
    font-size:12px; padding:6px 12px; border-radius:16px; white-space:nowrap;
  }
  .cat-tab.active{background:var(--accent-soft); border-color:var(--accent); color:var(--accent); font-weight:600;}

  .taglib-item{padding:10px 4px; border-bottom:1px solid var(--line);}
  .ti-top{display:flex; align-items:center; justify-content:space-between; gap:8px;}
  .taglib-item .taglib-name{font-size:14px; font-weight:600;}
  .taglib-item .taglib-del{background:none; border:none; color:var(--danger); font-size:12px; flex-shrink:0;}
  .ti-bottom{display:flex; gap:8px; margin-top:6px; flex-wrap:wrap;}
  .taglib-item .taglib-cat{background:var(--panel-alt2); border:1px solid var(--line); color:var(--ink-dim); font-size:11.5px; padding:4px 10px; border-radius:12px;}
  .taglib-item .taglib-assign{background:var(--accent-soft); border:1px solid var(--accent); color:var(--accent); font-size:11.5px; padding:4px 10px; border-radius:12px; font-weight:600;}
  .taglib-empty{color:var(--ink-dim); font-size:13px; text-align:center; padding:30px 10px;}

  .picker-list{display:flex; flex-wrap:wrap; gap:8px;}
  .picker-btn{
    background:var(--panel-alt2); border:1px solid var(--line); color:var(--ink);
    font-size:13.5px; padding:9px 14px; border-radius:10px; font-weight:500;
  }

  /* ---- Shop tab ---- */
  .shop-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:14px;}
  .shop-card{background:var(--panel); border:1px solid var(--line); border-left:3px solid var(--shop); border-radius:12px; padding:10px; display:flex; flex-direction:column; gap:8px;}
  .shop-card-photo{position:relative; width:100%; aspect-ratio:3/4; border-radius:8px; overflow:hidden; background:var(--panel-alt);}
  .shop-card-photo img{width:100%; height:100%; object-fit:cover; display:block;}
  .shop-no-photo{width:100%; height:100%; display:flex; align-items:center; justify-content:center; color:var(--ink-dim); font-size:11px;}
  .shop-card-del{position:absolute; top:5px; right:5px; width:24px; height:24px; border-radius:50%; background:rgba(10,13,10,0.75); border:none; color:var(--ink); font-size:12px; display:flex; align-items:center; justify-content:center;}
  .shop-name-input{width:100%; background:var(--panel-alt2); border:1px solid var(--line); border-radius:7px; padding:7px 9px; color:var(--ink); font-size:12.5px; outline:none; font-family:'Inter',sans-serif;}
  .shop-name-input:focus{border-color:var(--shop);}
  .shop-qty-row{display:flex; align-items:center; justify-content:center; gap:10px;}
  .qty-btn{width:30px; height:30px; border-radius:8px; background:var(--panel-alt2); border:1px solid var(--line); color:var(--ink); font-size:16px; line-height:1; display:flex; align-items:center; justify-content:center;}
  .qty-num{font-family:'JetBrains Mono',monospace; font-size:14px; min-width:22px; text-align:center;}
  .shop-buy-btn{background:var(--shop); color:#171D18; border:none; border-radius:8px; padding:9px; font-size:12px; font-weight:700;}
  .shop-buy-btn:disabled{background:var(--panel-alt2); color:var(--ink-dim); font-weight:500;}
  .shop-actions{display:flex; gap:6px;}
  .shop-actions .shop-buy-btn{flex:1;}
  .shop-sell-btn{flex:1; background:none; border:1px solid var(--shop); color:var(--shop); border-radius:8px; padding:9px; font-size:12px; font-weight:700;}
  .shop-price-row{display:flex; align-items:center; gap:6px;}
  .shop-price-label{font-size:11px; color:var(--ink-dim); flex-shrink:0;}
  .shop-price-input{
    width:100%; background:var(--panel-alt2); border:1px solid var(--line); border-radius:7px;
    padding:7px 9px; color:var(--ink); font-size:12.5px; outline:none; font-family:'JetBrains Mono',monospace;
  }
  .shop-price-input:focus{border-color:var(--shop);}
  .shop-name-display{font-size:12.5px; font-weight:700; color:var(--ink); text-align:center;}
  .shop-tier-badge{align-self:center; background:var(--panel-alt2); border:1px solid var(--line); color:var(--gm); font-size:10.5px; padding:2px 9px; border-radius:10px;}

  /* ---- Team gold ---- */
  .gold-row{display:flex; align-items:center; justify-content:space-between; gap:8px; padding:8px 4px; border-bottom:1px solid var(--line);}
  .gold-row:last-child{border-bottom:none;}
  .gold-label{font-size:13px; font-weight:600; color:var(--ink);}
  .gold-stepper{display:flex; align-items:center; gap:5px;}
  .gold-btn{background:var(--panel-alt2); border:1px solid var(--line); color:var(--ink); border-radius:7px; padding:5px 8px; font-size:11px; font-family:'JetBrains Mono',monospace;}
  .gold-num{font-family:'JetBrains Mono',monospace; font-size:14px; min-width:36px; text-align:center; font-weight:700; color:var(--inv);}

  /* ---- GM area ---- */
  .taglib-item .taglib-gm{background:rgba(139,123,168,0.15); border:1px solid rgba(139,123,168,0.5); color:var(--gm); font-size:11.5px; padding:4px 10px; border-radius:12px; font-weight:600;}
  .gm-del{background:none; border:none; color:var(--danger); font-size:12px;}
  .gm-restore{background:none; border:none; color:var(--gm); font-size:11.5px; font-weight:600;}
  .tier-group{margin-bottom:20px;}
  .tier-head{display:flex; align-items:center; gap:10px; margin-bottom:10px;}
  .tier-toggle{display:flex; align-items:center; gap:7px; font-weight:700; font-family:'Bitter',serif; color:var(--gm); font-size:14px;}
  .tier-toggle input{width:17px; height:17px; accent-color:var(--gm);}
  .tier-count{font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--ink-dim);}
  .cat-name-input, .cat-tier-input, .cat-price-input, .cat-qty-input{
    width:100%; background:var(--panel-alt2); border:1px solid var(--line); border-radius:7px;
    padding:7px 9px; color:var(--ink); font-size:12.5px; outline:none; font-family:'Inter',sans-serif;
  }
  .cat-name-input:focus, .cat-tier-input:focus, .cat-price-input:focus, .cat-qty-input:focus{border-color:var(--gm);}
  .gm-section{margin-bottom:14px; border:1px solid var(--line); border-radius:12px; overflow:hidden;}
  .gm-section-head{
    width:100%; display:flex; align-items:center; justify-content:space-between;
    background:var(--panel); border:none; padding:13px 14px; text-align:left;
  }
  .gm-section-title{font-family:'Bitter',serif; font-weight:700; font-size:14.5px;}
  .gm-section-chevron{color:var(--ink-dim); font-size:12px;}
  .gm-section-body{padding:14px; background:var(--panel-alt);}
  .school-group{margin-bottom:18px; padding-bottom:4px; border-bottom:1px dashed var(--line);}
  .school-head{font-family:'Bitter',serif; font-weight:700; font-size:13.5px; color:var(--cards); margin-bottom:10px;}
  .skill-name-input, .skill-school-input, .skill-level-input, .skill-cap-input,
  .hand-name-input, .hand-school-input, .hand-level-input, .hand-cap-input{
    width:100%; background:var(--panel-alt2); border:1px solid var(--line); border-radius:7px;
    padding:7px 9px; color:var(--ink); font-size:12.5px; outline:none; font-family:'Inter',sans-serif;
  }
  .skill-name-input:focus, .skill-school-input:focus, .skill-level-input:focus, .skill-cap-input:focus,
  .hand-name-input:focus, .hand-school-input:focus, .hand-level-input:focus, .hand-cap-input:focus{border-color:var(--cards);}

  /* ---- Cards overview tab ---- */
  .cards-level-group{margin-bottom:10px;}
  .cards-level-head{
    width:100%; display:flex; align-items:center; justify-content:space-between;
    background:var(--panel); border:1px solid var(--line); border-radius:9px; padding:9px 12px;
    font-size:12.5px; font-weight:600; color:var(--ink); margin-bottom:8px;

  .cards-level-body{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:6px;}
  .overview-card{background:var(--panel); border:1px solid var(--line); border-radius:9px; padding:6px; text-align:center;}
  .overview-card img{width:100%; aspect-ratio:3/4; object-fit:cover; border-radius:6px; display:block;}
  .overview-card-name{font-size:10.5px; margin-top:5px; color:var(--ink); line-height:1.3; word-break:break-word;}

  /* ---- Storage panel ---- */
  .storage-total{font-family:'JetBrains Mono',monospace; font-size:22px; font-weight:700; color:var(--accent); margin-bottom:14px;}
  .storage-row{display:flex; align-items:center; gap:10px; padding:10px 4px; border-bottom:1px solid var(--line);}
  .storage-row .sr-label{flex:1; font-size:13px;}
  .storage-row .sr-size{font-family:'JetBrains Mono',monospace; font-size:11.5px; color:var(--ink-dim);}
  .storage-row .sr-clear{background:none; border:1px solid var(--danger); color:var(--danger); font-size:11px; padding:5px 9px; border-radius:8px; flex-shrink:0;}
  .quota-block{margin-bottom:14px;}
  .quota-row{display:flex; justify-content:space-between; align-items:center; font-size:12px; margin-bottom:6px; gap:8px;}
  .quota-bar{height:8px; border-radius:5px; background:var(--panel-alt2); overflow:hidden;}
  .quota-bar-fill{height:100%; border-radius:5px; transition:width .3s;}
</style>
</head>
<body>

<div id="loadingCover" style="position:fixed; inset:0; background:var(--bg); z-index:9999; display:flex; align-items:center; justify-content:center; color:var(--ink-dim); font-family:'JetBrains Mono',monospace; font-size:13px; letter-spacing:0.05em;">載入存檔中…</div>

<header>
  <div class="session-row">
    <div style="flex:1">
      <div class="eyebrow">場次紀錄 · SESSION LOG</div>
      <input id="sessionName" type="text" placeholder="幫這場遊戲取個名字…" value="未命名場次">
    </div>
  </div>
  <div class="io-row">
    <button class="io-btn primary" id="btnExport">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 17v3a1 1 0 001 1h14a1 1 0 001-1v-3"/></svg>
      匯出存檔
    </button>
    <button class="io-btn" id="btnImport">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 15V3m0 12l-4-4m4 4l4-4M4 17v3a1 1 0 001 1h14a1 1 0 001-1v-3"/></svg>
      匯入讀檔
    </button>
    <button class="io-btn" id="btnStorage" style="flex:none; padding:9px 12px;">📊</button>
    <button class="io-btn" id="btnUndo" style="flex:none; padding:9px 12px;" disabled>↶</button>
    <button class="io-btn" id="btnRedo" style="flex:none; padding:9px 12px;" disabled>↷</button>
    <input type="file" id="importInput" accept="application/json">

<main>
  <div class="section-title">
    <h2 id="sectionTitle">地圖現況</h2>
    <span class="count" id="sectionCount">0 筆</span>
  </div>

  <div id="list"></div>

  <div id="equipView" style="display:none;">
    <div class="equip-toolbar">
      <button class="btn ghost" id="btnTagLib">🏷 標籤庫</button>
    </div>
    <div id="playerCards"></div>
  </div>

  <div id="invView" style="display:none;"></div>

  <div id="shopView" style="display:none;"></div>

  <div id="cardsView" style="display:none;"></div>

  <div id="gmView" style="display:none;"></div>
</main>

<button class="fab" id="fabAdd">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>
</button>

<nav class="tabs">
  <button data-cat="map" class="active"><span class="dot"></span>地圖現況</button>
  <button data-cat="equip"><span class="dot"></span>玩家裝備</button>
  <button data-cat="inv"><span class="dot"></span>團隊背包</button>
  <button data-cat="shop"><span class="dot"></span>商店區</button>
  <button data-cat="cards"><span class="dot"></span>遊戲卡牌</button>
  <button data-cat="gm"><span class="dot"></span>GM區</button>
</nav>

<!-- Add/edit sheet for map / inv / shop -->
<div class="overlay" id="overlay">
  <div class="sheet">
    <h3 id="sheetTitle">新增紀錄</h3>
    <div class="field">
      <label>照片</label>
      <div class="photo-input-row">
        <label class="photo-btn" for="photoCamera">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 8a2 2 0 012-2h1l1-2h8l1 2h1a2 2 0 012 2v10a2 2 0 01-2 2H6a2 2 0 01-2-2V8z"/><circle cx="12" cy="13" r="3.5"/></svg>
          拍照
        </label>
        <label class="photo-btn" for="photoFile">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="9.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
          從相簿選
        </label>
        <input type="file" id="photoCamera" accept="image/*" capture="environment">
        <input type="file" id="photoFile" accept="image/*">
      </div>
      <div id="photoPreviewWrap" class="photo-preview-wrap">
        <img id="photoPreview" alt="預覽">
        <button class="remove-photo" id="removePhoto" type="button">✕</button>
      </div>
    </div>
    <div class="field">
      <label>文字說明</label>
      <textarea id="noteInput" placeholder="記錄現況、數量、位置…"></textarea>
    </div>
    <div class="sheet-actions">
      <button class="btn cancel" id="btnCancel">取消</button>
      <button class="btn save" id="btnSave">儲存紀錄</button>
    </div>
  </div>
</div>

<!-- Player detail sheet -->
<div class="overlay" id="playerOverlay">
  <div class="sheet" id="playerSheetBody"></div>
</div>

<!-- Tag library sheet -->
<div class="overlay" id="taglibOverlay">
  <div class="sheet">
    <div id="taglibBody"></div>
  </div>
</div>

<!-- Storage usage sheet -->
<div class="overlay" id="storageOverlay">
  <div class="sheet">
    <div id="storageBody"></div>
  </div>
</div>

<div id="lightbox"><img id="lightboxImg" alt=""></div>
<div class="toast" id="toast"></div>

<script>
const CATS = {
  map:  {label:'地圖現況',   color:'#6E9BB0', empty:'還沒有地圖紀錄。拍下棋盤或地圖現況，方便下次接續遊戲。'},
  equip:{label:'玩家裝備',   color:'#C99A3C', empty:''},
  inv:  {label:'團隊背包',   color:'#7C9473', empty:'還沒有背包紀錄。記下團隊共用資源、道具與數量。'},
  shop: {label:'商店區',     color:'#B5533C', empty:'還沒有商店紀錄。記下目前上架品項、價格或庫存。'},
  cards:{label:'遊戲卡牌',   color:'#5E8AA8', empty:''},
  gm:   {label:'GM區',      color:'#8B7BA8', empty:''},
};

let state = {
  entries: [],          // map / inv / shop entries: {id, cat, note, photo, ts}
  equipPlayers: [],      // {id, name, photo}
  subareaDefs: [
    {id:'hand',     name:'手牌區', type:'simple'},
    {id:'discard',  name:'棄牌區', type:'simple'},
    {id:'equipment',name:'裝備區', type:'slots', slots:[]},
    {id:'threat',   name:'威脅區', type:'simple'},
    {id:'other',    name:'其他區', type:'simple'},
  ],
  tagLibrary: [],         // {name, category}[]
  playerAreaData: {},     // { [playerId]: { [subareaId]: {note,tags} | {slots:{[slotId]:{note,tags}}} } }
  teamInventory: {
    photo: null,
    note: '',
    slots: [],             // {id, name} e.g. 武器 / 防具 / 消耗品
    slotData: {},          // { [slotId]: {note, tags} }
    totalGold: 0,           // 團隊金庫
    playerGold: {},         // { [playerId]: number } 個人金額
  },
  shopCatalog: [],         // {id, photo, name, category, tier, price, qty, basePrice, baseQty, ts}
  unlockedTiers: [],       // string[]：目前開放給商店的等級
  skillCatalog: [],        // {id, photo, name, school, level, cap, ts}
  skillUnlocked: [],       // string[]："school|level" 開放給技能總攬區
  handCatalog: [],         // {id, photo, name, school, level, cap, ts}
  handUnlocked: [],        // string[]："school|level" 開放給手牌總攬區
  removedTags: [],         // GM 區：已移出遊戲的標籤 {id, name, category, removedAt}
  exported: true,
};
let activeCat = 'map';
let editingId = null;
let pendingPhoto = null;
let openPlayerId = null;

const $ = (sel) => document.querySelector(sel);
const listEl = $('#list');
const overlay = $('#overlay');

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function fmtTime(ts){
  const d = new Date(ts);
  const pad = n => String(n).padStart(2,'0');
  return `${pad(d.getMonth()+1)}/${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function markDirty(){
  state.exported = false;
  $('#statusHint').textContent = '已自動保存在此裝置 · 尚未匯出備份檔案，建議定期匯出保存';
  $('#statusHint').style.color = 'var(--danger)';
  scheduleAutoSave();
  scheduleHistoryPush();
}
function markClean(){
  state.exported = true;
  $('#statusHint').textContent = '已自動保存在此裝置 · 也已匯出備份檔案';
  $('#statusHint').style.color = '';
  scheduleAutoSave();
}
let toastTimer;
function showToast(msg){
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> t.classList.remove('show'), 2200);
}
function compressImage(file, cb, maxW=1000, quality=0.72){
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (e)=>{
    const img = new Image();
    img.onload = ()=>{
      const scale = Math.min(1, maxW / img.width);
      const canvas = document.createElement('canvas');
      canvas.width = img.width * scale;
      canvas.height = img.height * scale;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      cb(canvas.toDataURL('image/jpeg', quality));
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

/* ---------------- Tab switching ---------------- */
function setActiveCat(cat){
  activeCat = cat;
  document.querySelectorAll('nav.tabs button').forEach(b=>{
    const on = b.dataset.cat === cat;
    b.classList.toggle('active', on);
    b.style.setProperty('--tab-color', on ? CATS[cat].color : '');
  });
  document.documentElement.style.setProperty('--tab-color', CATS[cat].color);
  $('#sectionTitle').textContent = CATS[cat].label;
  $('#sectionTitle').style.color = CATS[cat].color;
  $('#fabAdd').style.background = CATS[cat].color;
  $('#fabAdd').style.display = (cat === 'inv' || cat === 'shop' || cat === 'gm' || cat === 'cards') ? 'none' : 'flex';
  listEl.style.display = (cat === 'equip' || cat === 'inv' || cat === 'shop' || cat === 'gm' || cat === 'cards') ? 'none' : 'block';
  $('#equipView').style.display = cat === 'equip' ? 'block' : 'none';
  $('#invView').style.display = cat === 'inv' ? 'block' : 'none';
  $('#shopView').style.display = cat === 'shop' ? 'block' : 'none';
  $('#cardsView').style.display = cat === 'cards' ? 'block' : 'none';
  $('#gmView').style.display = cat === 'gm' ? 'block' : 'none';
  $('#sectionCount').style.display = (cat === 'equip' || cat === 'inv' || cat === 'shop' || cat === 'gm' || cat === 'cards') ? 'none' : 'inline';
  if(cat === 'equip') renderPlayerList();
  else if(cat === 'inv') renderInvView();
  else if(cat === 'shop') renderShopView();
  else if(cat === 'cards') renderCardsView();
  else if(cat === 'gm') renderGMView();
  else render();
}
document.querySelectorAll('nav.tabs button').forEach(b=>{
  b.addEventListener('click', ()=> setActiveCat(b.dataset.cat));
});

/* ---------------- map / inv / shop list (unchanged model) ---------------- */
function render(){
  const items = state.entries.filter(e => e.cat === activeCat).sort((a,b)=>b.ts-a.ts);
  $('#sectionCount').textContent = items.length + ' 筆';
  if(items.length === 0){
    listEl.innerHTML = `<div class="empty"><div class="glyph">◌</div><p>${CATS[activeCat].empty}</p></div>`;
    return;
  }
  listEl.innerHTML = items.map(e => `
    <div class="card" style="--tab-color:${CATS[e.cat].color}" data-id="${e.id}">
      ${e.photo ? `<img src="${e.photo}" class="entry-photo" alt="紀錄照片">` : `<div class="no-photo">無照片</div>`}
      <div class="card-body">
        <div class="card-top"><span class="timestamp">${fmtTime(e.ts)}</span></div>
        <div class="note ${e.note ? '' : 'empty-note'}">${e.note ? escapeHtml(e.note) : '（無文字說明）'}</div>
        <div class="card-actions">
          <button class="edit"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>編輯</button>
          <button class="del"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4a1 1 0 011-1h6a1 1 0 011 1v2m2 0v14a1 1 0 01-1 1H7a1 1 0 01-1-1V6h12z"/></svg>刪除</button>
        </div>
      </div>
    </div>
  `).join('');
}
listEl.addEventListener('click', (ev)=>{
  const card = ev.target.closest('.card');
  if(!card) return;
  const id = card.dataset.id;
  if(ev.target.closest('.del')){
    if(confirm('確定要刪除這筆紀錄嗎？')){
      state.entries = state.entries.filter(e=>e.id!==id);
      markDirty(); render();
    }
    return;
  }
  if(ev.target.closest('.edit')){ openSheet(state.entries.find(e=>e.id===id)); return; }
  if(ev.target.closest('.entry-photo')){
    const e = state.entries.find(x=>x.id===id);
    $('#lightboxImg').src = e.photo;
    $('#lightbox').classList.add('show');
  }
});
$('#lightbox').addEventListener('click', ()=> $('#lightbox').classList.remove('show'));

function openSheet(entry){
  editingId = entry ? entry.id : null;
  pendingPhoto = entry ? entry.photo : null;
  $('#sheetTitle').textContent = (entry ? '編輯' : '新增') + '・' + CATS[activeCat].label;
  document.documentElement.style.setProperty('--tab-color', CATS[activeCat].color);
  $('#noteInput').value = entry ? (entry.note || '') : '';
  updatePhotoPreview();
  overlay.classList.add('show');
}
function closeSheet(){ overlay.classList.remove('show'); editingId = null; pendingPhoto = null; }
$('#btnCancel').addEventListener('click', closeSheet);

function updatePhotoPreview(){
  const wrap = $('#photoPreviewWrap');
  if(pendingPhoto){ wrap.style.display='block'; $('#photoPreview').src = pendingPhoto; }
  else { wrap.style.display='none'; }
}
$('#removePhoto').addEventListener('click', ()=>{ pendingPhoto = null; updatePhotoPreview(); });
$('#photoCamera').addEventListener('change', e => compressImage(e.target.files[0], (url)=>{pendingPhoto=url; updatePhotoPreview();}));
$('#photoFile').addEventListener('change', e => compressImage(e.target.files[0], (url)=>{pendingPhoto=url; updatePhotoPreview();}));

$('#btnSave').addEventListener('click', ()=>{
  const note = $('#noteInput').value.trim();
  if(!note && !pendingPhoto){ showToast('請至少填寫文字說明或上傳照片'); return; }
  if(editingId){
    const e = state.entries.find(x=>x.id===editingId);
    e.note = note; e.photo = pendingPhoto; e.ts = Date.now();
  } else {
    state.entries.push({ id: uid(), cat: activeCat, note, photo: pendingPhoto, ts: Date.now() });
  }
  markDirty(); closeSheet(); render();
});

$('#fabAdd').addEventListener('click', ()=>{
  if(activeCat === 'equip'){ addPlayer(); } else { openSheet(null); }
});

/* ---------------- Equip tab: players ---------------- */
function ensurePlayerData(playerId){
  if(!state.playerAreaData[playerId]) state.playerAreaData[playerId] = {};
  const pd = state.playerAreaData[playerId];
  state.subareaDefs.forEach(sa=>{
    if(sa.type === 'simple'){
      if(!pd[sa.id]) pd[sa.id] = {note:'', tags:[]};
    } else {
      if(!pd[sa.id]) pd[sa.id] = {slots:{}};
      sa.slots.forEach(slot=>{
        if(!pd[sa.id].slots[slot.id]) pd[sa.id].slots[slot.id] = {note:'', tags:[]};
      });
    }
  });
  return pd;
}

function addPlayer(){
  const name = prompt('玩家 / 角色名稱：');
  if(!name || !name.trim()) return;
  const p = {id: uid(), name: name.trim(), photo: null};
  state.equipPlayers.push(p);
  ensurePlayerData(p.id);
  markDirty();
  renderPlayerList();
  openPlayer(p.id);
}

function renderPlayerList(){
  const wrap = $('#playerCards');
  if(!state.equipPlayers.length){
    wrap.innerHTML = `<div class="empty"><div class="glyph">◌</div><p>還沒有玩家。點右下角「＋」新增玩家，開始記錄手牌、裝備、威脅等狀態。</p></div>`;
    return;
  }
  wrap.innerHTML = state.equipPlayers.map(p=>{
    const tagCount = countPlayerTags(p.id);
    return `
    <div class="player-card" data-id="${p.id}">
      ${p.photo ? `<img src="${p.photo}" alt="">` : `<div class="avatar-fallback">${escapeHtml((p.name||'?').slice(0,1))}</div>`}
      <div>
        <div class="pname">${escapeHtml(p.name)}</div>
        <div class="psub">${tagCount} 個標籤紀錄</div>
      </div>
      <span class="chevron">›</span>
    </div>`;
  }).join('');
}
function countPlayerTags(playerId){
  const pd = state.playerAreaData[playerId]; if(!pd) return 0;
  let n = 0;
  state.subareaDefs.forEach(sa=>{
    if(sa.type==='simple'){ n += (pd[sa.id]?.tags?.length || 0); }
    else { sa.slots.forEach(slot=>{ n += (pd[sa.id]?.slots?.[slot.id]?.tags?.length || 0); }); }
  });
  return n;
}
$('#playerCards').addEventListener('click', (ev)=>{
  const card = ev.target.closest('.player-card');
  if(card) openPlayer(card.dataset.id);
});

/* ---------------- Player detail sheet ---------------- */
function openPlayer(playerId){
  openPlayerId = playerId;
  ensurePlayerData(playerId);
  renderPlayerDetail();
  $('#playerOverlay').classList.add('show');
}
function closePlayerDetail(){
  $('#playerOverlay').classList.remove('show');
  openPlayerId = null;
  renderPlayerList();
}

function getSimpleArea(playerId, subareaId){
  return ensurePlayerData(playerId)[subareaId];
}
function getSlotArea(playerId, subareaId, slotId){
  if(playerId === '__team__'){
    if(!state.teamInventory.slotData[slotId]) state.teamInventory.slotData[slotId] = {note:'', tags:[]};
    return state.teamInventory.slotData[slotId];
  }
  const pd = ensurePlayerData(playerId);
  if(!pd[subareaId].slots[slotId]) pd[subareaId].slots[slotId] = {note:'', tags:[]};
  return pd[subareaId].slots[slotId];
}

function tagFieldHTML(playerId, subareaId, slotId, area, defaultCategory){
  const tags = area.tags || [];
  return `
  <div class="tagfield" data-player="${playerId}" data-subarea="${subareaId}" data-slot="${slotId||''}" data-defaultcat="${escapeHtml(defaultCategory||'')}">
    <div class="tag-chips">
      ${tags.length ? tags.map(t=>`<span class="tag-chip"><span class="tag-chip-name" data-tag="${escapeHtml(t)}">${escapeHtml(t)}</span><button class="tag-x" data-tag="${escapeHtml(t)}">×</button></span>`).join('') : '<span class="tag-empty">尚無標籤</span>'}
    </div>
    <div class="tag-add-row">
      <input type="text" class="tag-input" placeholder="輸入標籤名稱，或搜尋分類…">
      <button class="tag-add-btn" type="button">加入</button>
    </div>
    <div class="tag-suggest"></div>
  </div>`;
}

function renderPlayerDetail(){
  const p = state.equipPlayers.find(x=>x.id===openPlayerId);
  if(!p){ closePlayerDetail(); return; }
  const pd = ensurePlayerData(p.id);

  }

    const field = ev.target.closest('.tagfield');

    addTagToField(p.id, field, input.value.trim());

  }

    const sa = state.subareaDefs.find(x=>x.id===saDelete.dataset.sa);
    if(confirm(`確定要刪除「${sa.name}」這個區域嗎？所有玩家在此區域的紀錄都會一併刪除。`)){

      Object.keys(state.playerAreaData).forEach(pid => delete state.playerAreaData[pid][sa.id]);
      markDirty(); renderPlayerDetail();
    }

  }

  const slotRename = ev.target.closest('.slot-rename');
  if(slotRename){
    const sa = state.subareaDefs.find(x=>x.id===slotRename.dataset.sa);
    const slot = sa.slots.find(s=>s.id===slotRename.dataset.slot);
    const name = prompt('格子名稱：', slot.name);
    if(name && name.trim()){ slot.name = name.trim(); markDirty(); renderPlayerDetail(); }
    return;
  }

  const slotDelete = ev.target.closest('.slot-delete');
  if(slotDelete){
    const sa = state.subareaDefs.find(x=>x.id===slotDelete.dataset.sa);
    const slot = sa.slots.find(s=>s.id===slotDelete.dataset.slot);
    if(confirm(`確定要刪除格子「${slot.name}」嗎？`)){
      sa.slots = sa.slots.filter(s=>s.id!==slot.id);
      Object.keys(state.playerAreaData).forEach(pid=>{
        const areaObj = state.playerAreaData[pid][sa.id];
        if(areaObj && areaObj.slots) delete areaObj.slots[slot.id];
      });
      markDirty(); renderPlayerDetail();
    }
    return;
  }

  const addSlotBtn = ev.target.closest('.add-slot-btn');
  if(addSlotBtn){
    const sa = state.subareaDefs.find(x=>x.id===addSlotBtn.dataset.sa);
    const name = prompt('新格子名稱，例如：武器格、護甲格、飾品格…');

function renderTagSuggestions(input){
  const field = input.closest('.tagfield');
  const box = field.querySelector('.tag-suggest');
  const q = input.value.trim().toLowerCase();
  let matches;
  if(q){
    matches = state.tagLibrary.filter(t => t.name.toLowerCase().includes(q) || (t.category||'').toLowerCase().includes(q));
  } else {
    matches = state.tagLibrary.slice(0, 8);
  }
  matches = matches.slice(0, 8);
  box.innerHTML = matches.map(t => `<span class="sugg" data-tag="${escapeHtml(t.name)}">${escapeHtml(t.name)}${t.category ? ` <small>· ${escapeHtml(t.category)}</small>` : ''}</span>`).join('');

/* ---------------- Card cap enforcement ---------------- */
function getCardCap(tagName){
  const shopItem = state.shopCatalog.find(it=>it.name===tagName);
  if(shopItem) return (shopItem.baseQty !== undefined ? shopItem.baseQty : shopItem.qty);
  const skillItem = state.skillCatalog.find(it=>it.name===tagName);
  if(skillItem) return skillItem.cap;
  const handItem = state.handCatalog.find(it=>it.name===tagName);
  if(handItem) return handItem.cap;
  return null;
}
function countTagInPlay(tagName){
  let n = 0;
  Object.values(state.playerAreaData).forEach(pd=>{
    Object.values(pd).forEach(area=>{
      if(area.tags) n += area.tags.filter(t=>t===tagName).length;
      if(area.slots) Object.values(area.slots).forEach(s=> n += (s.tags||[]).filter(t=>t===tagName).length);
    });
  });
  Object.values(state.teamInventory.slotData||{}).forEach(s=> n += (s.tags||[]).filter(t=>t===tagName).length);
  return n;
}
function countTagRemoved(tagName){
  return state.removedTags.filter(rt=>rt.name===tagName).length;
}
function checkCapOrWarn(tagName){
  const cap = getCardCap(tagName);
  if(cap === null || cap === undefined || isNaN(cap)) return true;
  const used = countTagInPlay(tagName) + countTagRemoved(tagName);
  if(used >= cap){
    showToast(`「${tagName}」已達數量上限（${cap}張），無法再新增`);
    return false;
  }
  return true;
}

function addTagToField(playerId, field, value){
  if(!value) return;
  if(!checkCapOrWarn(value)) return;
  const {subarea, slot, defaultcat} = field.dataset;
  const area = slot ? getSlotArea(playerId, subarea, slot) : getSimpleArea(playerId, subarea);
  if(!area.tags.includes(value)) area.tags.push(value);
  let entry = state.tagLibrary.find(t=>t.name===value);
  if(entry){
    state.tagLibrary = state.tagLibrary.filter(t=>t.name!==value);
  } else {
    entry = {name:value, category: defaultcat || ''};
  }
  state.tagLibrary.unshift(entry);
  markDirty();
  renderPlayerDetail();
}

function addSubarea(){
  const name = prompt('新區域名稱，例如：狀態區、詛咒區…');
  if(!name || !name.trim()) return;
  const isSlots = confirm('這個區域是否需要再分成好幾個格子？（例如裝備區可分武器格、護甲格…）\n\n按「確定」＝需要分格子\n按「取消」＝只要一般文字＋標籤');
  const sa = {id: uid(), name: name.trim(), type: isSlots ? 'slots' : 'simple'};
  if(isSlots) sa.slots = [];
  state.subareaDefs.push(sa);
  markDirty();
  renderPlayerDetail();
}

function adjustGold(target, playerId, delta){
  if(target === 'team'){
    state.teamInventory.totalGold = Math.max(0, (state.teamInventory.totalGold||0) + delta);
  } else {
    if(!state.teamInventory.playerGold) state.teamInventory.playerGold = {};
    state.teamInventory.playerGold[playerId] = Math.max(0, (state.teamInventory.playerGold[playerId]||0) + delta);
  }
  markDirty(); renderInvView();
}
function setGoldExact(target, playerId){
  const cur = target === 'team' ? (state.teamInventory.totalGold||0) : ((state.teamInventory.playerGold||{})[playerId]||0);
  const val = prompt('輸入金額：', cur);
  if(val === null) return;
  const num = parseInt(val, 10);
  if(isNaN(num)) return;
  if(target === 'team') state.teamInventory.totalGold = Math.max(0, num);
  else { if(!state.teamInventory.playerGold) state.teamInventory.playerGold = {}; state.teamInventory.playerGold[playerId] = Math.max(0, num); }
  markDirty(); renderInvView();
}

function doBuyShopItem(item){
  const name = (item.name||'').trim();
  if(!name){ showToast('這張商品卡還沒有名稱，請先到 GM 區設定'); return; }
  if(item.qty <= 0) return;
  const price = item.price || 0;
  item.qty -= 1;
  const before = state.teamInventory.totalGold || 0;
  state.teamInventory.totalGold = Math.max(0, before - price);
  if(before < price) showToast(`團隊金庫不足，已扣至 0（原需 ${price}）`);
  markDirty();
  renderShopView();

  let entry = state.tagLibrary.find(t=>t.name===name);
  if(entry){ state.tagLibrary = state.tagLibrary.filter(t=>t.name!==name); }
  else { entry = {name, category: item.tier || '商店'}; }
  state.tagLibrary.unshift(entry);

  taglibTargetTag = name;
  taglibMode = 'assign';
  taglibPickerAction = 'assign'; taglibSourceScope = null;
  assignStep = 'destination'; assignPlayerId = null; assignSubareaId = null;
  renderTaglibOverlay();
  $('#taglibOverlay').classList.add('show');
}

function doSellShopItem(item){
  const name = (item.name||'').trim();
  if(!name){ showToast('這張商品卡還沒有名稱，請先到 GM 區設定'); return; }
  const val = prompt(`「${name}」的賣出價格：`, item.price || 0);
  if(val === null) return;
  const price = parseInt(val, 10);
  if(isNaN(price) || price < 0){ showToast('請輸入有效的金額'); return; }
  item.qty += 1;
  state.teamInventory.totalGold = (state.teamInventory.totalGold || 0) + price;
  markDirty();
  renderShopView();
  showToast(`已賣出「${name}」，團隊金庫 +${price}`);

  taglibTargetTag = name;
  taglibMode = 'assign';
  taglibPickerAction = 'remove'; taglibSourceScope = null;
  assignStep = 'destination'; assignPlayerId = null; assignSubareaId = null;
  renderTaglibOverlay();
  $('#taglibOverlay').classList.add('show');
}

$('#shopView').addEventListener('click', (ev)=>{
  const photo = ev.target.closest('.lightbox-photo');
  if(photo){ $('#lightboxImg').src = photo.src; $('#lightbox').classList.add('show'); return; }
  const buyBtn = ev.target.closest('.shop-buy-btn');
  if(buyBtn && !buyBtn.disabled){
    const item = state.shopCatalog.find(x=>x.id===buyBtn.dataset.id);
    if(item) doBuyShopItem(item);
    return;
  }
  const sellBtn = ev.target.closest('.shop-sell-btn');
  if(sellBtn){
    const item = state.shopCatalog.find(x=>x.id===sellBtn.dataset.id);
    if(item) doSellShopItem(item);
    return;
  }
});

/* ---------------- 遊戲卡牌 tab: read-only browsable overview ---------------- */
let cardsOpenSections = new Set(['hand','skill']);
let cardsGroupOpen = new Set();
let cardsFilter = {hand:'', skill:''};

function overviewGroupsHTML(prefix){
  const catalog = prefix === 'skill' ? state.skillCatalog : state.handCatalog;
  const unlocked = prefix === 'skill' ? state.skillUnlocked : state.handUnlocked;
  const q = cardsFilter[prefix].trim().toLowerCase();
  const visibleItems = catalog.filter(it=>{
    const key = (it.school||'') + '|' + (it.level||'');
    const isUnlocked = (!it.school || !it.level) || unlocked.includes(key);
    if(!isUnlocked) return false;
    if(q) return (it.name||'').toLowerCase().includes(q) || (it.school||'').toLowerCase().includes(q) || (it.level||'').toLowerCase().includes(q);
    return true;
  });
  if(!visibleItems.length) return `<div class="empty" style="padding:30px 10px;"><div class="glyph">◌</div><p>目前沒有已開放的卡牌可以顯示${q?'，或找不到符合搜尋的結果':''}。請到 GM 區設定並勾選開放。</p></div>`;

  const schools = Array.from(new Set(visibleItems.map(it=>it.school || '未分類')));
  return schools.map(school=>{
    const levels = Array.from(new Set(visibleItems.filter(it=>(it.school||'未分類')===school).map(it=>it.level||'未分級')));
    const levelHTML = levels.map(level=>{
      const items = visibleItems.filter(it=>(it.school||'未分類')===school && (it.level||'未分級')===level);
      const gkey = prefix+':'+school+'|'+level;
      const open = cardsGroupOpen.has(gkey);
      return `
      <div class="cards-level-group">
        <button class="cards-level-head" data-gkey="${escapeHtml(gkey)}">
          <span>${escapeHtml(level)}（${items.length}）</span>
          <span class="gm-section-chevron">${open?'▾':'▸'}</span>
        </button>
        <div class="cards-level-body" style="display:${open?'grid':'none'}">
          ${items.map(it=>`
            <div class="overview-card">
              ${it.photo ? `<img src="${it.photo}" class="lightbox-photo" alt="">` : `<div class="shop-no-photo">無照片</div>`}
              <div class="overview-card-name">${escapeHtml(it.name||'未命名')}</div>
            </div>`).join('')}
        </div>
      </div>`;
    }).join('');
    return `<div class="school-group"><div class="school-head">${escapeHtml(school)}</div>${levelHTML}</div>`;
  }).join('');
}

function renderCardsView(){
  const wrap = $('#cardsView');
  wrap.innerHTML = `
    <div class="gm-section">
      <button class="gm-section-head" data-csec="hand">
        <span class="gm-section-title" style="color:var(--cards)">🃏 手牌總攬區</span>
        <span class="gm-section-chevron">${cardsOpenSections.has('hand')?'▾':'▸'}</span>

        <div class="field" style="margin-bottom:12px;"><input type="text" id="handFilterInput" placeholder="搜尋流派、等級或卡牌名稱…" value="${escapeHtml(cardsFilter.hand)}"></div>
        <div id="handOverviewBody">${overviewGroupsHTML('hand')}</div>
      </div>
    </div>
    <div class="gm-section">
      <button class="gm-section-head" data-csec="skill">
        <span class="gm-section-title" style="color:var(--cards)">✨ 技能總攬區</span>
        <span class="gm-section-chevron">${cardsOpenSections.has('skill')?'▾':'▸'}</span>
      </button>
      <div class="gm-section-body" style="display:${cardsOpenSections.has('skill')?'block':'none'}">
        <div class="field" style="margin-bottom:12px;"><input type="text" id="skillFilterInput" placeholder="搜尋流派、等級或技能名稱…" value="${escapeHtml(cardsFilter.skill)}"></div>
        <div id="skillOverviewBody">${overviewGroupsHTML('skill')}</div>

$('#cardsView').addEventListener('click', (ev)=>{
  const photo = ev.target.closest('.lightbox-photo');
  if(photo){ $('#lightboxImg').src = photo.src; $('#lightbox').classList.add('show'); return; }
  const secHead = ev.target.closest('.gm-section-head[data-csec]');
  if(secHead){
    const id = secHead.dataset.csec;

$('#cardsView').addEventListener('input', (ev)=>{

/* ---------------- Tag library sheet ---------------- */
let taglibMode = 'list';      // 'list' | 'assign' | 'category'
let taglibSearch = '';
let taglibCatFilter = '__all__';
let taglibTargetTag = null;
let taglibPickerAction = 'assign';  // 'assign' | 'remove' | 'move'
let taglibSourceScope = null;       // {player, subarea, slot} when opened from an in-place tag chip
let assignStep = 'destination';    // 'destination' | 'subarea' | 'slot' | 'invslot'
let assignPlayerId = null;
let assignSubareaId = null;

$('#btnTagLib').addEventListener('click', ()=>{
  taglibMode = 'list'; taglibSearch = ''; taglibCatFilter = '__all__';
  renderTaglibOverlay();
  $('#taglibOverlay').classList.add('show');
});

function getAllCategories(){
  const set = new Set();
  state.tagLibrary.forEach(t => set.add(t.category ? t.category : '__none__'));
  return Array.from(set);
}

function renderTaglibOverlay(){
  const body = $('#taglibBody');
  if(taglibMode === 'assign'){ body.innerHTML = assignPanelHTML(); return; }
  if(taglibMode === 'category'){ body.innerHTML = categoryPanelHTML(); return; }
  body.innerHTML = `
    <h3>🏷 標籤庫</h3>
    <div class="hint" style="margin-bottom:10px;">點「指定去哪」可以直接把標籤放進團隊背包或某位玩家的區域；點分類徽章可以改分類。</div>
    <div class="field" style="margin-bottom:10px;">
      <input type="text" id="taglibSearch" placeholder="搜尋標籤名稱或分類…" value="${escapeHtml(taglibSearch)}">
    </div>
    <div class="cat-tabs" id="catTabsWrap"></div>
    <div id="taglibList"></div>
    <div class="sheet-actions" style="margin-top:14px;">
      <button class="btn cancel" id="btnCloseTaglib">關閉</button>
    </div>
  `;
  updateTaglibListView();
}

function updateTaglibListView(){
  const cats = getAllCategories();
  const tabsHTML = ['__all__', ...cats].map(c=>{
    const label = c==='__all__' ? '全部' : (c==='__none__' ? '未分類' : c);
    const active = taglibCatFilter === c;
    return `<button class="cat-tab ${active?'active':''}" data-cat="${escapeHtml(c)}">${escapeHtml(label)}</button>`;
  }).join('');
  $('#catTabsWrap').innerHTML = tabsHTML;

  let items = state.tagLibrary;
  if(taglibCatFilter !== '__all__') items = items.filter(t => (t.category?t.category:'__none__') === taglibCatFilter);
  const q = taglibSearch.trim().toLowerCase();
  if(q) items = items.filter(t => t.name.toLowerCase().includes(q) || (t.category||'').toLowerCase().includes(q));
  items = items.slice().sort((a,b)=> a.name.length - b.name.length || a.name.localeCompare(b.name, 'zh-Hant'));

  $('#taglibList').innerHTML = items.length ? items.map(t=>{
    const cap = getCardCap(t.name);
    const capBadge = cap !== null && cap !== undefined ? `<span class="taglib-cat" style="opacity:.8;">${countTagInPlay(t.name)+countTagRemoved(t.name)}/${cap} 張</span>` : '';
    return `
    <div class="taglib-item">
      <div class="ti-top">
        <span class="taglib-name">${escapeHtml(t.name)}</span>
        <button class="taglib-del" data-tag="${escapeHtml(t.name)}">刪除</button>
      </div>
      <div class="ti-bottom">
        <button class="taglib-cat" data-tag="${escapeHtml(t.name)}">${t.category ? escapeHtml(t.category) : '未分類'}</button>
        ${capBadge}
        <button class="taglib-assign" data-tag="${escapeHtml(t.name)}">指定去哪 →</button>
        <button class="taglib-gm" data-tag="${escapeHtml(t.name)}">移出遊戲 →</button>
      </div>
    </div>`;
  }).join('') : `<div class="taglib-empty">${state.tagLibrary.length ? '找不到符合的標籤' : '標籤庫是空的，先在玩家裝備區新增幾個標籤試試看。'}</div>`;
}

function assignPanelHTML(){
  const playerName = assignPlayerId ? (state.equipPlayers.find(x=>x.id===assignPlayerId)?.name || '') : '';
  const verb = taglibPickerAction === 'remove' ? '移除' : (taglibPickerAction === 'move' ? '移動' : '指定');

  if(assignStep === 'destination'){
    const playerBtns = state.equipPlayers.map(p=>`<button class="picker-btn" data-player="${p.id}">${escapeHtml(p.name)}</button>`).join('');
    let hintText = '選擇要放到哪裡：';
    if(taglibPickerAction === 'remove') hintText = '這件物品原本在哪裡？（選了才會從那邊移除標籤）';
    if(taglibPickerAction === 'move') hintText = '要移到哪裡？（選「賣到商店」會直接換成金錢）';
    return `
      <h3>${verb}「${escapeHtml(taglibTargetTag)}」</h3>
      <div class="hint" style="margin-bottom:12px;">${hintText}</div>
      <div class="picker-list">
        <button class="picker-btn" data-dest="inventory">🎒 團隊背包</button>
        <button class="picker-btn" data-dest="sell">🏪 賣到商店（換錢）</button>
        ${playerBtns}
      </div>
      ${!state.equipPlayers.length ? `<div class="hint" style="margin-top:10px;">還沒有玩家，可以到「玩家裝備」分頁新增。</div>` : ''}
      <div class="sheet-actions" style="margin-top:16px; flex-wrap:wrap;">
        ${(taglibPickerAction === 'remove' || taglibPickerAction === 'move') ? `<button class="btn ghost" id="btnSkipRemove" style="flex:1;">取消，不做變動</button>` : ''}
        <button class="btn cancel" id="btnAssignBack" style="flex:1;">返回標籤庫</button>
      </div>
    `;
  }

  let stepDesc = '';
  let stepHTML = '';
  if(assignStep === 'invslot'){
    stepDesc = `🎒 團隊背包 → 選擇分類：`;
    stepHTML = state.teamInventory.slots.length
      ? state.teamInventory.slots.map(s=>`<button class="picker-btn" data-invslot="${s.id}">${escapeHtml(s.name)}</button>`).join('')
      : `<div class="taglib-empty">團隊背包還沒有分類，請先到「團隊背包」分頁新增分類。</div>`;
  } else if(assignStep === 'subarea'){
    stepDesc = `玩家：${escapeHtml(playerName)} → 選擇區域：`;
    stepHTML = state.subareaDefs.map(sa=>`<button class="picker-btn" data-subarea="${sa.id}">${escapeHtml(sa.name)}</button>`).join('');
  } else if(assignStep === 'slot'){
    const sa = state.subareaDefs.find(x=>x.id===assignSubareaId);
    stepDesc = `玩家：${escapeHtml(playerName)} → ${escapeHtml(sa.name)} → 選擇格子：`;
    stepHTML = sa.slots.length
      ? sa.slots.map(s=>`<button class="picker-btn" data-slot="${s.id}">${escapeHtml(s.name)}</button>`).join('')
      : `<div class="taglib-empty">這個區域還沒有格子，請先到玩家頁面新增格子。</div>`;
  }
  return `
    <h3>${verb}「${escapeHtml(taglibTargetTag)}」</h3>
    <div class="hint" style="margin-bottom:12px;">${stepDesc}</div>
    <div class="picker-list">${stepHTML}</div>
    <div class="sheet-actions" style="margin-top:16px;">
      <button class="btn cancel" id="btnAssignBack">‹ 上一步</button>
    </div>
  `;
}

function categoryPanelHTML(){
  const cats = Array.from(new Set(state.tagLibrary.map(t=>t.category).filter(Boolean)));
  return `
    <h3>「${escapeHtml(taglibTargetTag)}」的分類</h3>
    <div class="picker-list">
      <button class="picker-btn cat-choice" data-cat="">未分類</button>
      ${cats.map(c=>`<button class="picker-btn cat-choice" data-cat="${escapeHtml(c)}">${escapeHtml(c)}</button>`).join('')}
    </div>
    <div class="field" style="margin-top:16px;">
      <label>或新增分類</label>
      <div style="display:flex; gap:8px;">
        <input type="text" id="newCatInput" placeholder="輸入新分類名稱…">
        <button class="btn save" id="btnNewCatConfirm" style="flex:none; padding:10px 16px;">套用</button>
      </div>
    </div>
    <div class="sheet-actions" style="margin-top:16px;">
      <button class="btn cancel" id="btnCatBack">‹ 返回</button>
    </div>
  `;
}

/* ---- Picker helpers shared by tag library / in-place tag moves ---- */
function scopesEqual(a, b){
  if(!a || !b) return false;
  return a.player === b.player && a.subarea === b.subarea && (a.slot||'') === (b.slot||'');
}
function scopeArea(scope){
  return scope.slot ? getSlotArea(scope.player, scope.subarea, scope.slot) : getSimpleArea(scope.player, scope.subarea);
}
function removeTagFromScope(scope, tagName){
  const area = scopeArea(scope);
  area.tags = area.tags.filter(t=>t!==tagName);
}
function finishPickerFlow(){
  assignStep = 'destination'; assignPlayerId = null; assignSubareaId = null;
  if(taglibPickerAction === 'move'){
    $('#taglibOverlay').classList.remove('show');
    taglibSourceScope = null; taglibPickerAction = 'assign';
    if(openPlayerId) renderPlayerDetail();
    if(activeCat === 'inv') renderInvView();
  } else {
    renderTaglibOverlay();
  }
}
function openMovePicker(tagName, sourceScope){
  taglibTargetTag = tagName;
  taglibSourceScope = sourceScope;
  taglibPickerAction = 'move';
  taglibMode = 'assign';
  assignStep = 'destination'; assignPlayerId = null; assignSubareaId = null;
  renderTaglibOverlay();
  $('#taglibOverlay').classList.add('show');
}
function doSellToShop(){
  const val = prompt(`「${taglibTargetTag}」的賣出價格：`, 0);
  if(val === null) return;
  const price = parseInt(val, 10);
  if(isNaN(price) || price < 0){ showToast('請輸入有效的金額'); return; }
  state.teamInventory.totalGold = (state.teamInventory.totalGold || 0) + price;
  if(taglibPickerAction === 'move' && taglibSourceScope){
    removeTagFromScope(taglibSourceScope, taglibTargetTag);
  }
  markDirty();
  showToast(`已賣出「${taglibTargetTag}」，團隊金庫 +${price}`);
  finishPickerFlow();
}

function doAssignTag(playerId, subareaId, slotId){
  ensurePlayerData(playerId);
  const destScope = {player: playerId, subarea: subareaId, slot: slotId};
  if(taglibPickerAction === 'move' && scopesEqual(destScope, taglibSourceScope)){
    showToast('已經在這裡了'); finishPickerFlow(); return;
  }
  const area = slotId ? getSlotArea(playerId, subareaId, slotId) : getSimpleArea(playerId, subareaId);
  const pname = state.equipPlayers.find(x=>x.id===playerId)?.name || '';
  if(taglibPickerAction === 'remove'){
    area.tags = area.tags.filter(t=>t!==taglibTargetTag);
    markDirty();
    showToast(`已從 ${pname} 移除「${taglibTargetTag}」`);
  } else {
    if(taglibPickerAction === 'assign' && !area.tags.includes(taglibTargetTag) && !checkCapOrWarn(taglibTargetTag)) return;
    if(!area.tags.includes(taglibTargetTag)) area.tags.push(taglibTargetTag);
    if(taglibPickerAction === 'move' && taglibSourceScope) removeTagFromScope(taglibSourceScope, taglibTargetTag);
    markDirty();
    showToast(`已把「${taglibTargetTag}」${taglibPickerAction==='move' ? '移到' : '加到'} ${pname}`);
  }
  finishPickerFlow();
}

function doAssignTagToInventory(slotId){
  const destScope = {player: '__team__', subarea: 'inventory', slot: slotId};
  if(taglibPickerAction === 'move' && scopesEqual(destScope, taglibSourceScope)){
    showToast('已經在這裡了'); finishPickerFlow(); return;
  }
  const area = getSlotArea('__team__', 'inventory', slotId);
  if(taglibPickerAction === 'remove'){
    area.tags = area.tags.filter(t=>t!==taglibTargetTag);
    markDirty();
    showToast(`已從團隊背包移除「${taglibTargetTag}」`);
  } else {
    if(taglibPickerAction === 'assign' && !area.tags.includes(taglibTargetTag) && !checkCapOrWarn(taglibTargetTag)) return;
    if(!area.tags.includes(taglibTargetTag)) area.tags.push(taglibTargetTag);
    if(taglibPickerAction === 'move' && taglibSourceScope) removeTagFromScope(taglibSourceScope, taglibTargetTag);
    markDirty();
    showToast(`已把「${taglibTargetTag}」${taglibPickerAction==='move' ? '移到' : '放進'}團隊背包`);
  }
  finishPickerFlow();
}

$('#taglibBody').addEventListener('click', (ev)=>{
  if(ev.target.closest('#btnCloseTaglib')){ $('#taglibOverlay').classList.remove('show'); return; }

  const catTab = ev.target.closest('.cat-tab');
  if(catTab){ taglibCatFilter = catTab.dataset.cat; updateTaglibListView(); return; }

  const delBtn = ev.target.closest('.taglib-del');
  if(delBtn){
    state.tagLibrary = state.tagLibrary.filter(t=>t.name!==delBtn.dataset.tag);
    markDirty(); updateTaglibListView(); return;
  }

  const catBtn = ev.target.closest('.taglib-cat');
  if(catBtn){ taglibTargetTag = catBtn.dataset.tag; taglibMode = 'category'; renderTaglibOverlay(); return; }

  const assignBtn = ev.target.closest('.taglib-assign');
  if(assignBtn){
    taglibTargetTag = assignBtn.dataset.tag; taglibMode = 'assign';
    taglibPickerAction = 'assign'; taglibSourceScope = null;
    assignStep = 'destination'; assignPlayerId = null; assignSubareaId = null;
    renderTaglibOverlay(); return;
  }

  const gmBtn = ev.target.closest('.taglib-gm');
  if(gmBtn){
    const entry = state.tagLibrary.find(t=>t.name===gmBtn.dataset.tag);
    if(entry && confirm(`確定要把「${entry.name}」移出遊戲嗎？之後就不會在標籤庫或指定清單中出現。`)){
      state.tagLibrary = state.tagLibrary.filter(t=>t.name!==entry.name);
      state.removedTags.push({id:uid(), name:entry.name, category:entry.category||'', removedAt:Date.now()});
      markDirty();
      updateTaglibListView();
      showToast(`已把「${entry.name}」移到 GM 區`);
    }
    return;
  }

  const skipRemove = ev.target.closest('#btnSkipRemove');
  if(skipRemove){ taglibSourceScope = null; taglibPickerAction = 'assign'; $('#taglibOverlay').classList.remove('show'); return; }

  const destBtn = ev.target.closest('.picker-btn[data-dest]');
  if(destBtn){
    if(destBtn.dataset.dest === 'inventory'){ assignStep = 'invslot'; renderTaglibOverlay(); }
    else if(destBtn.dataset.dest === 'sell'){ doSellToShop(); }
    return;
  }

  const invSlotBtn = ev.target.closest('.picker-btn[data-invslot]');
  if(invSlotBtn){ doAssignTagToInventory(invSlotBtn.dataset.invslot); return; }

  const playerBtn = ev.target.closest('.picker-btn[data-player]');
  if(playerBtn){ assignPlayerId = playerBtn.dataset.player; assignStep = 'subarea'; renderTaglibOverlay(); return; }

  const subareaBtn = ev.target.closest('.picker-btn[data-subarea]');
  if(subareaBtn){
    assignSubareaId = subareaBtn.dataset.subarea;
    const sa = state.subareaDefs.find(x=>x.id===assignSubareaId);
    if(sa.type === 'slots'){ assignStep = 'slot'; renderTaglibOverlay(); }
    else { doAssignTag(assignPlayerId, assignSubareaId, null); }
    return;
  }

  const slotBtn = ev.target.closest('.picker-btn[data-slot]');
  if(slotBtn){ doAssignTag(assignPlayerId, assignSubareaId, slotBtn.dataset.slot); return; }

  const assignBack = ev.target.closest('#btnAssignBack');
  if(assignBack){
    if(assignStep === 'destination'){
      taglibMode = 'list'; taglibSourceScope = null; taglibPickerAction = 'assign';
    }
    else if(assignStep === 'subarea' || assignStep === 'invslot'){ assignStep = 'destination'; }
    else if(assignStep === 'slot'){ assignStep = 'subarea'; }
    renderTaglibOverlay(); return;
  }

  const catChoice = ev.target.closest('.cat-choice');
  if(catChoice){
    const entry = state.tagLibrary.find(t=>t.name===taglibTargetTag);
    entry.category = catChoice.dataset.cat;
    markDirty(); taglibMode = 'list'; renderTaglibOverlay(); return;
  }

  const catConfirm = ev.target.closest('#btnNewCatConfirm');
  if(catConfirm){
    const val = $('#newCatInput').value.trim();
    if(val){
      const entry = state.tagLibrary.find(t=>t.name===taglibTargetTag);
      entry.category = val;
      markDirty();
    }
    taglibMode = 'list'; renderTaglibOverlay(); return;
  }

/* ---------------- GM area (removed cards) ---------------- */
let gmOpenSections = new Set(['removed','shop']);
function sectionWrap(id, title, colorVar, bodyHtml){
  const open = gmOpenSections.has(id);
  return `
  <div class="gm-section">
    <button class="gm-section-head" data-sec="${id}">

function syncCatalogTag(name, category){
  if(!name) return;
  let entry = state.tagLibrary.find(t=>t.name===name);
  if(entry){ entry.category = category; }
  else { state.tagLibrary.unshift({name, category}); }
}

function schoolCardHTML(it, prefix){
  return `
    <div class="shop-card" data-id="${it.id}">

        ${it.photo ? `<img src="${it.photo}" alt="">` : `<div class="shop-no-photo">無照片</div>`}

function renderSchoolCatalogSection(prefix, title, uploadLabel){
  const catalogArr = prefix === 'skill' ? state.skillCatalog : state.handCatalog;
  const unlockedArr = prefix === 'skill' ? state.skillUnlocked : state.handUnlocked;
  const schools = Array.from(new Set(catalogArr.map(it => it.school || '未分類流派')));
  const body = schools.map(school=>{
    const levels = Array.from(new Set(catalogArr.filter(it=>(it.school||'未分類流派')===school).map(it=>it.level || '未分級')));
    const levelHTML = levels.map(level=>{
      const items = catalogArr.filter(it=>(it.school||'未分類流派')===school && (it.level||'未分級')===level);
      const key = school + '|' + level;
      const unlocked = unlockedArr.includes(key);
      return `
      <div class="tier-group">
        <div class="tier-head">
          <label class="tier-toggle">
            <input type="checkbox" class="${prefix}-unlock-check" data-key="${escapeHtml(key)}" ${unlocked?'checked':''}>
            <span>${escapeHtml(level)}</span>
          </label>
          <span class="tier-count">${items.length} 項</span>
        </div>
        <div class="shop-grid">${items.map(it=>schoolCardHTML(it, prefix)).join('')}</div>
      </div>`;
    }).join('');
    return `<div class="school-group"><div class="school-head">${escapeHtml(school)}</div>${levelHTML}</div>`;
  }).join('');

  return `
    <div class="equip-toolbar" style="justify-content:flex-start; gap:8px; flex-wrap:wrap;">
      <label class="io-btn primary" for="${prefix}Upload" style="flex:none; padding:9px 14px;">${uploadLabel}</label>
      <input type="file" id="${prefix}Upload" accept="image/*" multiple>
    </div>
    <div class="hint" style="margin:8px 0 12px;">上傳卡牌後，直接在卡片上填流派、等級、名稱與數量上限；勾選等級即可開放到「遊戲卡牌」分頁給玩家瀏覽。設定好名稱後會自動加進標籤庫。</div>
    ${body || `<div class="empty"><div class="glyph">◌</div><p>還沒有${title}，先上傳照片建立。</p></div>`}
  `;
}

function getCatalogByPrefix(prefix){ return prefix === 'skill' ? state.skillCatalog : state.handCatalog; }
function getUnlockedByPrefix(prefix){ return prefix === 'skill' ? state.skillUnlocked : state.handUnlocked; }
function tagCategoryForPrefix(prefix){ return prefix === 'skill' ? '技能' : '手牌'; }

function handleSchoolUpload(prefix, fileList){
  const files = Array.from(fileList || []);
  if(!files.length) return;
  let remaining = files.length;
  files.forEach(file=>{
    compressImage(file, (url)=>{
      const item = {id: uid(), photo:url, name:'', school:'', level:'', cap:1, ts:Date.now()};
      if(prefix==='skill') state.skillCatalog.push(item); else state.handCatalog.push(item);
      remaining--;
      if(remaining===0){ markDirty(); renderGMView(); }
    }, 1100, 0.82);
  });
}

function renderGMView(){
  const wrap = $('#gmView');
  const removedHTML = state.removedTags.length ? state.removedTags.map(rt=>`
    <div class="taglib-item">
      <div class="ti-top">
        <span class="taglib-name">${escapeHtml(rt.name)}</span>
        <button class="gm-del" data-id="${rt.id}">刪除</button>
      </div>
      <div class="ti-bottom">
        <span class="taglib-cat">${rt.category ? escapeHtml(rt.category) : '未分類'}</span>
        <span class="taglib-cat" style="opacity:.7;">${fmtTime(rt.removedAt)}</span>
        <button class="gm-restore" data-id="${rt.id}">移回並指定位置 ↩</button>
      </div>
    </div>`).join('') : `<div class="empty"><div class="glyph">◌</div><p>還沒有移出遊戲的卡牌。在「🏷 標籤庫」裡點某個標籤的「移出遊戲」，就會出現在這裡。移出後，這張卡的數量上限會永久減 1。</p></div>`;

  const removedBody = `
    <div class="equip-toolbar" style="justify-content:flex-start;">
      <button class="btn ghost" id="btnGmAdd">＋ 手動新增</button>
    </div>
    <div class="hint" style="margin:6px 0 12px;">已經永久離場、銷毀、或不再使用的卡牌可以放這裡歸檔，標籤庫和指定清單就不會再出現，避免誤用。</div>
    ${removedHTML}
  `;

  wrap.innerHTML = `
    ${sectionWrap('removed', `🗑 移出遊戲的卡牌（${state.removedTags.length}）`, 'var(--gm)', removedBody)}
    ${sectionWrap('shop', '🏪 商店品項總表', 'var(--shop)', renderShopCatalogSection())}
    ${sectionWrap('skill', '✨ 技能卡總表', 'var(--cards)', renderSchoolCatalogSection('skill', '技能卡', '📥 新增技能卡照片'))}
    ${sectionWrap('hand', '🃏 手牌卡總表', 'var(--cards)', renderSchoolCatalogSection('hand', '手牌卡', '📥 新增手牌卡照片'))}
  `;
  $('#btnGmAdd')?.addEventListener('click', ()=>{
    const name = prompt('要移出的卡牌名稱：');
    if(name && name.trim()){
      state.removedTags.push({id:uid(), name:name.trim(), category:'', removedAt:Date.now()});
      markDirty(); renderGMView();
    }
  });
  $('#catalogMultiUpload')?.addEventListener('change', e => handleCatalogUpload(e.target.files));
  $('#skillUpload')?.addEventListener('change', e => handleSchoolUpload('skill', e.target.files));
  $('#handUpload')?.addEventListener('change', e => handleSchoolUpload('hand', e.target.files));
