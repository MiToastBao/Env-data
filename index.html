function handleCatalogUpload(fileList){
  const files = Array.from(fileList || []);
  if(!files.length) return;
  let remaining = files.length;
  files.forEach(file=>{
    compressImage(file, (url)=>{
      state.shopCatalog.push({id: uid(), photo:url, name:'', category:'', tier:'', price:0, qty:1, basePrice:0, baseQty:1, ts:Date.now()});
      remaining--;
      if(remaining === 0){ markDirty(); renderGMView(); }
    }, 1100, 0.82);
  });
}

$('#gmView').addEventListener('click', (ev)=>{
  const secHead = ev.target.closest('.gm-section-head');
  if(secHead){
    const id = secHead.dataset.sec;
    if(gmOpenSections.has(id)) gmOpenSections.delete(id); else gmOpenSections.add(id);
    renderGMView();
    return;
  }

  const delBtn = ev.target.closest('.gm-del');
  if(delBtn){
    if(confirm('確定要永久刪除這筆紀錄嗎？')){
      state.removedTags = state.removedTags.filter(x=>x.id!==delBtn.dataset.id);
      markDirty(); renderGMView();
    }
    return;
  }
  const restoreBtn = ev.target.closest('.gm-restore');
  if(restoreBtn){
    const rt = state.removedTags.find(x=>x.id===restoreBtn.dataset.id);
    if(rt){
      state.removedTags = state.removedTags.filter(x=>x.id!==rt.id);
      if(!state.tagLibrary.find(t=>t.name===rt.name)){
        state.tagLibrary.unshift({name:rt.name, category:rt.category||''});
      }
      markDirty();
      showToast(`已把「${rt.name}」移回標籤庫，請選擇要放到哪裡`);
      taglibTargetTag = rt.name; taglibMode = 'assign';
      taglibPickerAction = 'assign'; taglibSourceScope = null;
      assignStep = 'destination'; assignPlayerId = null; assignSubareaId = null;
      renderTaglibOverlay();
      $('#taglibOverlay').classList.add('show');
    }
    return;
  }
  const catDel = ev.target.closest('.shop-card-del');
  if(catDel){
    if(confirm('確定要刪除這個商品嗎？')){
      state.shopCatalog = state.shopCatalog.filter(x=>x.id!==catDel.dataset.id);
      forgetPhoto(catDel.dataset.id);
      markDirty(); renderGMView();
    }
    return;
  }
  const schoolCardDel = ev.target.closest('.skill-card-del, .hand-card-del');
  if(schoolCardDel){
    const prefix = schoolCardDel.classList.contains('skill-card-del') ? 'skill' : 'hand';
    if(confirm('確定要刪除這張卡牌嗎？')){
      if(prefix==='skill') state.skillCatalog = state.skillCatalog.filter(x=>x.id!==schoolCardDel.dataset.id);
      else state.handCatalog = state.handCatalog.filter(x=>x.id!==schoolCardDel.dataset.id);
      forgetPhoto(schoolCardDel.dataset.id);
      markDirty(); renderGMView();
    }
    return;
  }
});
$('#gmView').addEventListener('change', (ev)=>{
  if(ev.target.classList.contains('tier-check')){
    const tier = ev.target.dataset.tier;
    if(ev.target.checked){ if(!state.unlockedTiers.includes(tier)) state.unlockedTiers.push(tier); }
    else { state.unlockedTiers = state.unlockedTiers.filter(t=>t!==tier); }
    markDirty();
    showToast(ev.target.checked ? `已開放「${tier}」給商店` : `已關閉「${tier}」`);
    return;
  }
  if(ev.target.classList.contains('cat-tier-input')){
    const item = state.shopCatalog.find(x=>x.id===ev.target.dataset.id);
    if(item){ item.tier = ev.target.value.trim(); markDirty(); renderGMView(); }
    return;
  }
  if(ev.target.classList.contains('cat-category-input')){
    const item = state.shopCatalog.find(x=>x.id===ev.target.dataset.id);
    if(item){ item.category = ev.target.value.trim(); if(item.name) syncCatalogTag(item.name, item.category); markDirty(); }
    return;
  }
  if(ev.target.classList.contains('skill-unlock-check') || ev.target.classList.contains('hand-unlock-check')){
    const prefix = ev.target.classList.contains('skill-unlock-check') ? 'skill' : 'hand';
    const key = ev.target.dataset.key;
    let arr = getUnlockedByPrefix(prefix);
    if(ev.target.checked){ if(!arr.includes(key)) arr.push(key); }
    else { arr = arr.filter(k=>k!==key); if(prefix==='skill') state.skillUnlocked = arr; else state.handUnlocked = arr; }
    markDirty();
    showToast(ev.target.checked ? `已開放「${key.replace('|',' - ')}」` : `已關閉「${key.replace('|',' - ')}」`);
    return;
  }
  const schoolInput = ev.target.classList.contains('skill-school-input') || ev.target.classList.contains('hand-school-input');
  const levelInput = ev.target.classList.contains('skill-level-input') || ev.target.classList.contains('hand-level-input');
  if(schoolInput || levelInput){
    const prefix = ev.target.classList.contains('skill-school-input') || ev.target.classList.contains('skill-level-input') ? 'skill' : 'hand';
    const item = getCatalogByPrefix(prefix).find(x=>x.id===ev.target.dataset.id);
    if(item){
      if(schoolInput) item.school = ev.target.value.trim(); else item.level = ev.target.value.trim();
      markDirty(); renderGMView();
    }
    return;
  }
});
$('#gmView').addEventListener('input', (ev)=>{
  const id = ev.target.dataset.id;
  if(!id) return;
  if(ev.target.classList.contains('cat-name-input') || ev.target.classList.contains('cat-price-input') || ev.target.classList.contains('cat-qty-input')){
    const item = state.shopCatalog.find(x=>x.id===id);
    if(!item) return;
    if(ev.target.classList.contains('cat-name-input')){ item.name = ev.target.value; if(item.name) syncCatalogTag(item.name, item.category||''); }
    else if(ev.target.classList.contains('cat-price-input')){ item.price = Math.max(0, parseInt(ev.target.value,10)||0); item.basePrice = item.price; }
    else if(ev.target.classList.contains('cat-qty-input')){ item.qty = Math.max(0, parseInt(ev.target.value,10)||0); item.baseQty = item.qty; }
    markDirty();
    return;
  }
  const prefix = ev.target.classList.contains('skill-name-input') || ev.target.classList.contains('skill-cap-input') ? 'skill'
    : (ev.target.classList.contains('hand-name-input') || ev.target.classList.contains('hand-cap-input') ? 'hand' : null);
  if(prefix){
    const item = getCatalogByPrefix(prefix).find(x=>x.id===id);
    if(!item) return;
    if(ev.target.classList.contains(prefix+'-name-input')){ item.name = ev.target.value; if(item.name) syncCatalogTag(item.name, tagCategoryForPrefix(prefix)); }
    else if(ev.target.classList.contains(prefix+'-cap-input')){ item.cap = Math.max(0, parseInt(ev.target.value,10)||0); }
    markDirty();
  }
});

/* ---------------- Snapshots (quick-save / whole-state) ---------------- */
function captureSnapshot(){
  return JSON.parse(JSON.stringify({
    sessionName: $('#sessionName').value || '未命名場次',
    entries: state.entries,
    equipPlayers: state.equipPlayers,
    subareaDefs: state.subareaDefs,
    tagLibrary: state.tagLibrary,
    playerAreaData: state.playerAreaData,
    teamInventory: state.teamInventory,
    shopCatalog: state.shopCatalog,
    unlockedTiers: state.unlockedTiers,
    skillCatalog: state.skillCatalog,
    skillUnlocked: state.skillUnlocked,
    handCatalog: state.handCatalog,
    handUnlocked: state.handUnlocked,
    removedTags: state.removedTags,
  }));
}
function applySnapshot(snap){
  state.entries = snap.entries || [];
  state.equipPlayers = snap.equipPlayers || [];
  state.subareaDefs = snap.subareaDefs || state.subareaDefs;
  state.tagLibrary = (snap.tagLibrary || []).map(t => typeof t === 'string' ? {name:t, category:''} : t);
  state.playerAreaData = snap.playerAreaData || {};
  state.teamInventory = snap.teamInventory || {photo:null, note:'', slots:[], slotData:{}, totalGold:0, playerGold:{}};
  if(state.teamInventory.totalGold === undefined) state.teamInventory.totalGold = 0;
  if(!state.teamInventory.playerGold) state.teamInventory.playerGold = {};
  state.shopCatalog = (snap.shopCatalog || snap.shopItems || []).map(it => ({
    baseQty: it.qty, basePrice: it.price, tier: '', category: '', ...it,
  }));
  state.unlockedTiers = snap.unlockedTiers || [];
  state.skillCatalog = snap.skillCatalog || [];
  state.skillUnlocked = snap.skillUnlocked || [];
  state.handCatalog = snap.handCatalog || [];
  state.handUnlocked = snap.handUnlocked || [];
  state.removedTags = snap.removedTags || [];
  $('#sessionName').value = snap.sessionName || '未命名場次';
  if(activeCat === 'equip') renderPlayerList();
  else if(activeCat === 'inv') renderInvView();
  else if(activeCat === 'shop') renderShopView();
  else if(activeCat === 'cards') renderCardsView();
  else if(activeCat === 'gm') renderGMView();
  else render();
}

/* ---------------- Storage usage panel ---------------- */
function formatBytes(chars){
  const kb = chars / 1024;
  if(kb < 1024) return kb.toFixed(1) + ' KB';
  return (kb/1024).toFixed(2) + ' MB';
}
function computeStorageBreakdown(){
  const sizeOf = (obj) => JSON.stringify(obj).length;
  return [
    {key:'map',        label:'地圖現況',     size: sizeOf(state.entries.filter(e=>e.cat==='map'))},
    {key:'equip',       label:'玩家裝備',     size: sizeOf({equipPlayers:state.equipPlayers, playerAreaData:state.playerAreaData})},
    {key:'inv',         label:'團隊背包',     size: sizeOf(state.teamInventory)},
    {key:'shop',        label:'商店卡片',     size: sizeOf(state.shopCatalog)},
    {key:'skill',       label:'技能卡總表',   size: sizeOf(state.skillCatalog)},
    {key:'hand',        label:'手牌卡總表',   size: sizeOf(state.handCatalog)},
    {key:'gm',          label:'GM 移出區',    size: sizeOf(state.removedTags)},
    {key:'taglib',      label:'標籤庫',       size: sizeOf(state.tagLibrary)},
  ];
}
function estimateLocalStorageUsageBytes(){
  let total = 0;
  try{
    for(let i=0;i<localStorage.length;i++){
      const k = localStorage.key(i);
      if(k && k.startsWith('boardgame-save-tool-v1:')) total += k.length + (localStorage.getItem(k)||'').length;
    }
  }catch(e){}
  return total;
}
const LOCAL_STORAGE_ASSUMED_CAP = 5 * 1024 * 1024;
function deviceQuotaBlockHTML(){
  if(hasNativeStorage) return '';
  const used = estimateLocalStorageUsageBytes();
  const ratio = Math.min(1, used / LOCAL_STORAGE_ASSUMED_CAP);
  const pct = Math.round(ratio*100);
  const color = ratio >= 0.9 ? 'var(--danger)' : (ratio >= 0.7 ? 'var(--accent)' : 'var(--inv)');
  return `
    <div class="quota-block">
      <div class="quota-row">
        <span>裝置儲存空間（估計，此瀏覽器專用）</span>
        <span class="mono" style="color:${color};">${formatBytes(used)} / ~5MB（${pct}%）</span>
      </div>
      <div class="quota-bar"><div class="quota-bar-fill" style="width:${pct}%; background:${color};"></div></div>
      ${ratio>=0.8 ? `<div class="hint" style="color:var(--danger); margin-top:6px;">快滿了，建議盡快匯出備份，並清除一些用不到的舊卡牌照片。</div>` : ''}
    </div>`;
}
function renderStorageOverlay(){
  const rows = computeStorageBreakdown();
  const total = rows.reduce((s,r)=>s+r.size, 0);
  $('#storageBody').innerHTML = `
    <h3>📊 目前佔用空間</h3>
    <div class="storage-total">${formatBytes(total)}</div>
    ${deviceQuotaBlockHTML()}
    <div class="hint" style="margin-bottom:10px;">瀏覽器不會直接提供記憶體用量，這裡以目前資料換算成 JSON 大小來估算。自動保存已經拆成好幾包分開存（商店/技能卡/手牌卡/其他各自獨立），單一分類太大時只有那個分類會保存失敗，不會拖累其他資料；照片是佔用空間的主因。</div>
    ${rows.map(r=>`
      <div class="storage-row">
        <span class="sr-label">${r.label}</span>
        <span class="sr-size">${formatBytes(r.size)}</span>
        <button class="sr-clear" data-key="${r.key}">清除</button>
      </div>`).join('')}
    <div class="sheet-actions" style="margin-top:16px;">
      <button class="btn cancel" id="btnCloseStorage">關閉</button>
    </div>
  `;
}
function clearStorageCategory(key){
  const labels = {map:'地圖現況', equip:'玩家裝備', inv:'團隊背包', shop:'商店卡片', skill:'技能卡總表', hand:'手牌卡總表', gm:'GM 移出區', taglib:'標籤庫'};
  if(!confirm(`確定要清除「${labels[key]}」的資料嗎？此動作無法復原（除非你有備份存檔）。`)) return;
  switch(key){
    case 'map': state.entries = state.entries.filter(e=>e.cat!=='map'); break;
    case 'equip': state.equipPlayers = []; state.playerAreaData = {}; break;
    case 'inv': state.teamInventory = {photo:null, note:'', slots:[], slotData:{}, totalGold:0, playerGold:{}}; break;
    case 'shop': state.shopCatalog = []; state.unlockedTiers = []; break;
    case 'skill': state.skillCatalog = []; state.skillUnlocked = []; break;
    case 'hand': state.handCatalog = []; state.handUnlocked = []; break;
    case 'gm': state.removedTags = []; break;
    case 'taglib': state.tagLibrary = []; break;
  }
  markDirty();
  renderStorageOverlay();
  if(activeCat === 'equip') renderPlayerList();
  else if(activeCat === 'inv') renderInvView();
  else if(activeCat === 'shop') renderShopView();
  else if(activeCat === 'cards') renderCardsView();
  else if(activeCat === 'gm') renderGMView();
  else render();
}
$('#btnStorage').addEventListener('click', ()=>{ renderStorageOverlay(); $('#storageOverlay').classList.add('show'); });
$('#storageBody').addEventListener('click', (ev)=>{
  if(ev.target.closest('#btnCloseStorage')){ $('#storageOverlay').classList.remove('show'); return; }
  const clearBtn = ev.target.closest('.sr-clear');
  if(clearBtn){ clearStorageCategory(clearBtn.dataset.key); return; }
});

/* ---------------- Export / Import ---------------- */
$('#btnExport').addEventListener('click', ()=>{
  const payload = {
    type: 'boardgame-save',
    version: 9,
    sessionName: $('#sessionName').value || '未命名場次',
    savedAt: Date.now(),
    entries: state.entries,
    equipPlayers: state.equipPlayers,
    subareaDefs: state.subareaDefs,
    tagLibrary: state.tagLibrary,
    playerAreaData: state.playerAreaData,
    teamInventory: state.teamInventory,
    shopCatalog: state.shopCatalog,
    unlockedTiers: state.unlockedTiers,
    skillCatalog: state.skillCatalog,
    skillUnlocked: state.skillUnlocked,
    handCatalog: state.handCatalog,
    handUnlocked: state.handUnlocked,
    removedTags: state.removedTags,
  };
  const blob = new Blob([JSON.stringify(payload)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const d = new Date();
  const pad = n=>String(n).padStart(2,'0');
  const fname = `${(payload.sessionName||'桌遊存檔').replace(/[\\/:*?"<>|]/g,'')}_${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}_${pad(d.getHours())}${pad(d.getMinutes())}.json`;
  a.href = url; a.download = fname;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  markClean();
  showToast('已匯出存檔檔案');
});

$('#btnImport').addEventListener('click', ()=> $('#importInput').click());
$('#importInput').addEventListener('change', (e)=>{
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (ev)=>{
    try{
      const data = JSON.parse(ev.target.result);

      if(data.type !== 'boardgame-save') throw new Error('not a save file');
      const doProceed = (state.entries.length === 0 && state.equipPlayers.length === 0) || confirm('讀檔將會覆蓋目前尚未匯出的紀錄，確定要繼續嗎？');
      if(!doProceed) return;

      applySnapshot(data);
      markClean();
      showToast('讀檔成功，已還原紀錄');
    } catch(err){
      showToast('讀取失敗，請確認是正確的存檔檔案');
    }
  };
  reader.readAsText(file);
  e.target.value = '';
});

$('#sessionName').addEventListener('input', markDirty);

window.addEventListener('beforeunload', (e)=>{
  if(!state.exported && (state.entries.length || state.equipPlayers.length)){
    e.preventDefault(); e.returnValue = '';
  }
});

/* ---------------- Undo / redo history ---------------- */
let undoStack = [];
let redoStack = [];
let isRestoringHistory = false;
let historyDebounceTimer = null;
function captureFullSnapshot(){ return captureSnapshot(); }
function scheduleHistoryPush(){
  if(isRestoringHistory) return;
  clearTimeout(historyDebounceTimer);
  historyDebounceTimer = setTimeout(()=>{
    undoStack.push(JSON.stringify(captureFullSnapshot()));
    if(undoStack.length > 30) undoStack.shift();
    redoStack = [];
    updateUndoRedoButtons();
  }, 1200);
}
function updateUndoRedoButtons(){
  $('#btnUndo').disabled = undoStack.length < 2;
  $('#btnRedo').disabled = redoStack.length < 1;
}
function doUndo(){
  if(undoStack.length < 2){ showToast('沒有更早的步驟了'); return; }
  isRestoringHistory = true;
  const current = undoStack.pop();
  redoStack.push(current);
  const prev = undoStack[undoStack.length-1];
  applySnapshot(JSON.parse(prev));
  isRestoringHistory = false;
  updateUndoRedoButtons();
  showToast('已回到上一步');
}
function doRedo(){
  if(!redoStack.length){ showToast('沒有下一步了'); return; }
  isRestoringHistory = true;
  const next = redoStack.pop();
  undoStack.push(next);
  applySnapshot(JSON.parse(next));
  isRestoringHistory = false;
  updateUndoRedoButtons();
  showToast('已重做');
}
$('#btnUndo').addEventListener('click', doUndo);
$('#btnRedo').addEventListener('click', doRedo);

/* ---------------- Storage backend: native window.storage (in Claude) or localStorage fallback (standalone site) ---------------- */
const hasNativeStorage = (typeof window.storage !== 'undefined') && window.storage && typeof window.storage.get === 'function';
const appStorage = hasNativeStorage ? window.storage : {
  async get(key){
    const raw = localStorage.getItem('boardgame-save-tool-v1:'+key);
    if(raw === null) throw new Error('not found');
    return { key, value: raw };
  },
  async set(key, value){
    localStorage.setItem('boardgame-save-tool-v1:'+key, value);
    return { key, value };
  },
  async delete(key){
    localStorage.removeItem('boardgame-save-tool-v1:'+key);
    return { key, deleted:true };
  },
  async list(prefix){
    const ids = [];
    const fullPrefix = 'boardgame-save-tool-v1:' + (prefix||'');
    for(let i=0;i<localStorage.length;i++){
      const k = localStorage.key(i);
      if(k && k.startsWith(fullPrefix)) ids.push(k.slice(fullPrefix.length));
    }
    return { keys: ids };
  },
};
async function listPhotoIds(){
  try{
    const r = await appStorage.list('photo:');
    const keys = (r && r.keys) ? r.keys : [];
    return keys.map(k => k.startsWith('photo:') ? k.slice('photo:'.length) : k);
  }catch(e){ return []; }
}
async function pruneOrphanedPhotos(){
  const validIds = new Set([
    ...state.shopCatalog.map(it=>it.id),
    ...state.skillCatalog.map(it=>it.id),
    ...state.handCatalog.map(it=>it.id),
  ]);
  const ids = await listPhotoIds();
  for(const id of ids){
    if(!validIds.has(id)){
      try{ await appStorage.delete('photo:'+id); }catch(e){}
      persistedPhotoIds.delete(id);
    }
  }
}

let autoSaveTimer = null;
function scheduleAutoSave(){
  clearTimeout(autoSaveTimer);
  autoSaveTimer = setTimeout(flushAutoSaveNow, 700);
}
async function safeStorageGet(key){
  try{
    const r = await appStorage.get(key);
    return r ? r.value : null;
  }catch(e){ return null; }
}
function stripPhotos(catalogArr){
  return catalogArr.map(({photo, ...rest}) => rest);
}
let persistedPhotoIds = new Set();
async function forgetPhoto(id){
  persistedPhotoIds.delete(id);
  try{ await appStorage.delete("photo:"+id); }catch(e){ /* 沒存過就算了 */ }
}
async function persistCatalogPhotos(catalogArr){
  let allOk = true;
  for(const it of catalogArr){
    if(!it.photo || persistedPhotoIds.has(it.id)) continue;
    try{
      await appStorage.set("photo:"+it.id, it.photo);
      persistedPhotoIds.add(it.id);
    }catch(e){
      console.error('圖片保存失敗:'+it.id, e);
      allOk = false;
    }
  }
  return allOk;
}
async function persistCurrentState(){
  const snap = captureSnapshot();
  const { shopCatalog, skillCatalog, handCatalog, ...core } = snap;
  const failedLabels = [];
  const metaParts = [
    ['state-core', core, '其他資料'],
    ['state-shop', stripPhotos(shopCatalog), '商店品項總表'],
    ['state-skill', stripPhotos(skillCatalog), '技能卡總表'],
    ['state-hand', stripPhotos(handCatalog), '手牌卡總表'],
  ];
  for(const [key, val, label] of metaParts){
    try{ await appStorage.set(key, JSON.stringify(val)); }
    catch(e){ console.error('自動存檔失敗:'+key, e); failedLabels.push(label); }
  }
  const photoOk = await Promise.all([
    persistCatalogPhotos(state.shopCatalog),
    persistCatalogPhotos(state.skillCatalog),
    persistCatalogPhotos(state.handCatalog),
  ]);
  if(photoOk.some(ok=>!ok)) failedLabels.push('卡牌圖片（單張過大）');
  if(failedLabels.length){
    showToast(`「${[...new Set(failedLabels)].join('、')}」自動保存失敗，建議到「📊」清除或先手動匯出備份`);
  }
  await pruneOrphanedPhotos();
  checkLocalStorageQuotaWarning();
}
let lastQuotaWarnAt = 0;
function checkLocalStorageQuotaWarning(){
  if(hasNativeStorage) return;
  const ratio = estimateLocalStorageUsageBytes() / LOCAL_STORAGE_ASSUMED_CAP;
  if(ratio < 0.8) return;
  const now = Date.now();
  if(now - lastQuotaWarnAt < 5 * 60 * 1000) return;
  lastQuotaWarnAt = now;
  showToast(`⚠️ 裝置儲存空間約用了 ${Math.round(ratio*100)}%，快滿了，建議盡快匯出備份並清除舊照片`);
}
function flushAutoSaveNow(){
  clearTimeout(autoSaveTimer);
  persistCurrentState();
}
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState === 'hidden') flushAutoSaveNow();
});
window.addEventListener('pagehide', flushAutoSaveNow);

async function attachPhotos(catalogArr){
  await Promise.all(catalogArr.map(async (it)=>{
    const val = await safeStorageGet('photo:'+it.id);
    if(val){ it.photo = val; persistedPhotoIds.add(it.id); }
  }));
}

async function cleanupLegacyStorage(){
  try{ await appStorage.delete('current-state'); }catch(e){}
  try{ await appStorage.delete('quicksaves'); }catch(e){}
  if(!hasNativeStorage){
    try{
      const toRemove = [];
      for(let i=0;i<localStorage.length;i++){
        const k = localStorage.key(i);
        if(k && k.startsWith('bgst:')) toRemove.push(k);
      }
      toRemove.forEach(k=>localStorage.removeItem(k));
    }catch(e){}
  }
}

async function initApp(){
  try{
    const coreVal = await safeStorageGet('state-core');
    let snap = null;
    if(coreVal){
      snap = JSON.parse(coreVal);
      const shopVal = await safeStorageGet('state-shop');
      const skillVal = await safeStorageGet('state-skill');
      const handVal = await safeStorageGet('state-hand');
      snap.shopCatalog = shopVal ? JSON.parse(shopVal) : [];
      snap.skillCatalog = skillVal ? JSON.parse(skillVal) : [];
      snap.handCatalog = handVal ? JSON.parse(handVal) : [];
      await attachPhotos(snap.shopCatalog);
      await attachPhotos(snap.skillCatalog);
      await attachPhotos(snap.handCatalog);
    } else {
      const legacy = await safeStorageGet('current-state');
      if(legacy) snap = JSON.parse(legacy);
    }
    if(snap){ applySnapshot(snap); markClean(); }
  }catch(e){ /* 尚無存檔，從空白開始 */ }

  await cleanupLegacyStorage();

  undoStack = [JSON.stringify(captureFullSnapshot())];
  redoStack = [];
  updateUndoRedoButtons();

  setActiveCat('map');
  const cover = document.getElementById('loadingCover');
  if(cover) cover.remove();
  pruneOrphanedPhotos();
}
initApp();
</script>
