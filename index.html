<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>桌遊管理工具</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#171D18">
<style>
  :root{
    --bg:#171D18; --panel:#212A22; --panel-alt:#2A342B; --panel-alt2:#333F35;
    --ink:#EDE6D6; --ink-dim:#9FB0A2;
    --accent:#C99A3C; --accent-soft:rgba(201,154,60,0.16);
    --danger:#B5533C; --line:rgba(237,230,214,0.12);
    --map:#6E9BB0; --equip:#C99A3C; --inv:#7C9473; --shop:#B5533C; --gm:#8B7BA8;
    --safe-t: env(safe-area-inset-top, 0px);
    --safe-b: env(safe-area-inset-bottom, 0px);
  }
  :root[data-theme="light"]{
    --bg:#F3F0E8; --panel:#FFFFFF; --panel-alt:#F1EDE2; --panel-alt2:#E6E0D2;
    --ink:#2B2A25; --ink-dim:#736F62;
    --accent-soft:rgba(201,154,60,0.20);
    --line:rgba(43,42,37,0.14);
  }
  body, .section, .player-card, .shop-card, .taglib-item{ transition: background-color .2s, color .2s, border-color .2s; }
  .switch{position:relative; display:inline-block; width:46px; height:27px; flex-shrink:0;}
  .switch input{opacity:0; width:0; height:0;}
  .switch-slider{position:absolute; inset:0; cursor:pointer; background:var(--panel-alt2); border:1px solid var(--line); border-radius:27px; transition:.2s;}
  .switch-slider:before{position:absolute; content:""; height:19px; width:19px; left:3px; top:3px; background:var(--ink-dim); border-radius:50%; transition:.2s;}
  .switch input:checked + .switch-slider{background:var(--accent-soft); border-color:var(--accent);}
  .switch input:checked + .switch-slider:before{transform:translateX(19px); background:var(--accent);}
  .switch input:disabled + .switch-slider{opacity:.4;}
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%; margin:0; overscroll-behavior:none;}
  body{
    background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang TC','Microsoft JhengHei',sans-serif;
  }
  .serif{font-family:Georgia,'Noto Serif TC',serif;}
  .mono{font-family:'SFMono-Regular',Consolas,'Courier New',monospace;}
  button{font-family:inherit; cursor:pointer;}
  input,textarea{font-family:inherit;}

  #app{display:flex; flex-direction:column; height:100vh; height:100dvh; overflow:hidden;}

  /* ---- Top bar ---- */
  #topbar{
    flex:0 0 auto; display:flex; align-items:center; gap:8px;
    padding:calc(8px + var(--safe-t)) 10px 8px; background:rgba(23,29,24,0.96);
    border-bottom:1px solid var(--line); backdrop-filter:blur(8px); z-index:20;
  }
  #topbar .tb-btn{
    flex:0 0 auto; background:var(--panel-alt); border:1px solid var(--line); color:var(--ink);
    border-radius:10px; padding:11px 14px; font-size:18px; display:flex; align-items:center; gap:4px; min-height:44px;
  }
  #topbar .tb-btn:disabled{opacity:0.35;}
  #topbar .tb-title{flex:1; font-family:Georgia,serif; font-weight:700; font-size:17.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--ink-dim);}
  #goldChip{
    flex:0 0 auto; background:var(--accent-soft); border:1px solid var(--accent); color:var(--accent);
    border-radius:20px; padding:7px 12px; font-weight:700; font-size:16.3px; font-family:monospace;
  }

  /* ---- Main ---- */
  #main{flex:1 1 auto; min-height:0; overflow-y:auto; overflow-x:hidden; -webkit-overflow-scrolling:touch; padding:14px 14px 24px;}
  .tabpanel{display:none;}
  .tabpanel.active{display:block;}

  /* ---- Bottom nav ---- */
  #gmFab{
    display:none; position:fixed; right:16px; bottom:calc(78px + var(--safe-b)); z-index:30;
    width:56px; height:56px; border-radius:50%; background:var(--gm); color:#171D18; border:none;
    font-size:28px; line-height:1; box-shadow:0 6px 18px rgba(0,0,0,.45);
  }
  #bottomnav{
    flex:0 0 auto; display:flex; overflow-x:auto; background:rgba(23,29,24,0.97);
    border-top:1px solid var(--line); padding-bottom:var(--safe-b); -webkit-overflow-scrolling:touch;
  }
  #bottomnav button{
    flex:1 1 0; min-width:56px; background:none; border:none; color:var(--ink-dim);
    display:flex; flex-direction:column; align-items:center; gap:4px; padding:11px 2px 9px; min-height:52px;
    font-size:13.5px; position:relative; white-space:nowrap;
  }
  #bottomnav button .dot{width:5px;height:5px;border-radius:50%; background:currentColor; opacity:0.3;}
  #bottomnav button.active{color:var(--tabc, var(--accent));}
  #bottomnav button.active .dot{opacity:1; background:var(--tabc, var(--accent)); box-shadow:0 0 6px var(--tabc, var(--accent));}
  #bottomnav button.active::before{content:""; position:absolute; top:0; left:22%; right:22%; height:2px; background:var(--tabc, var(--accent));}

  /* ---- Generic bits ---- */
  .hint{font-size:14.6px; color:var(--ink-dim); line-height:1.5;}
  .empty{text-align:center; padding:40px 16px; color:var(--ink-dim);}
  .empty .glyph{font-size:31.7px; margin-bottom:8px; opacity:.6;}
  .field{margin-bottom:12px;}
  .field label{display:block; font-size:14px; color:var(--ink-dim); margin-bottom:5px; font-weight:600;}
  .field input[type=text], .field input[type=number], .field textarea, .field select{
    width:100%; background:var(--panel-alt2); border:1px solid var(--line); border-radius:8px;
    padding:12px 12px; color:var(--ink); font-size:16.9px; outline:none; min-height:44px;
  }
  .field textarea{min-height:64px; resize:vertical; line-height:1.5;}
  .btn{border:none; border-radius:10px; padding:13px 12px; font-size:16.3px; font-weight:600; min-height:44px;}
  .btn.primary{background:var(--accent); color:#171D18;}
  .btn.ghost{background:var(--panel-alt2); border:1px solid var(--line); color:var(--ink);}
  .btn.danger{background:none; border:1px solid var(--danger); color:var(--danger);}
  .btn.sm{padding:7px 10px; font-size:14.6px;}
  .row{display:flex; gap:8px; flex-wrap:wrap;}
  .grow{flex:1;}

  /* ---- Collapsible section ---- */
  .section{border:1px solid var(--line); border-radius:12px; margin-bottom:12px; overflow:hidden; background:var(--panel);}
  .section-head{width:100%; display:flex; align-items:center; justify-content:space-between; gap:8px; background:none; border:none; padding:12px 13px; text-align:left;}
  .section-head .st{font-family:Georgia,serif; font-weight:700; font-size:17.5px;}
  .section-head .sc{color:var(--ink-dim); font-size:14px;}
  .section-body{padding:12px; background:var(--panel-alt); display:none;}
  .section.open .section-body{display:block;}
  .section.open .chev{transform:rotate(90deg);}
  .chev{transition:transform .15s; color:var(--ink-dim); font-size:14px;}

  /* ---- Photo grid (battlefield / player / catalog thumbs) ---- */
  .photo-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(96px,1fr)); gap:8px; margin-bottom:10px;}
  .photo-item{position:relative; border-radius:9px; overflow:hidden; background:var(--panel-alt2); border:1px solid var(--line);}
  .photo-item img{width:100%; aspect-ratio:4/3; object-fit:cover; display:block; cursor:pointer;}
  .photo-item .pi-del{position:absolute; top:4px; right:4px; width:30px; height:30px; border-radius:50%; background:rgba(10,13,10,0.8); border:none; color:var(--ink); font-size:16px;}
  .photo-add-row{display:flex; gap:8px; margin-bottom:10px;}
  .photo-add-row label{
    flex:1; text-align:center; background:var(--panel-alt2); border:1px dashed var(--line); color:var(--ink-dim);
    border-radius:9px; padding:14px; font-size:15.2px; min-height:44px;
  }
  .bf-photo-card{margin-bottom:16px;}
  .bf-photo-card img{width:100%; max-height:65vh; object-fit:contain; background:#000; border-radius:12px; border:1px solid var(--line); display:block; cursor:pointer;}

  /* ---- Tag chips / fields ---- */
  .tagfield{margin-bottom:6px;}
  .tag-chips{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:7px;}
  .tag-chip{display:inline-flex; align-items:center; gap:5px; background:var(--accent-soft); border:1px solid rgba(201,154,60,.4); color:var(--accent); font-size:15.2px; padding:5px 5px 5px 10px; border-radius:16px;}
  .tag-chip .tcn{cursor:pointer;}
  .tag-chip .tcx{background:none; border:none; color:var(--accent); opacity:.7; font-size:17px; padding:4px 6px; min-width:28px; min-height:28px;}
  .tag-empty{font-size:14.6px; color:var(--ink-dim); font-style:italic;}
  .tag-add-row{display:flex; gap:6px;}
  .tag-add-row input{flex:1; background:var(--panel-alt2); border:1px solid var(--line); border-radius:8px; padding:10px 11px; color:var(--ink); font-size:15.8px; outline:none; min-height:44px;}
  .tag-add-row button{background:var(--accent); color:#171D18; border:none; border-radius:8px; padding:0 16px; font-size:15.2px; font-weight:700; min-height:44px;}
  .tag-suggest{display:flex; flex-wrap:wrap; gap:5px; margin-top:6px;}
  .tag-suggest span{background:var(--panel); border:1px dashed var(--line); color:var(--ink-dim); font-size:14px; padding:3px 9px; border-radius:14px;}
  .cat-block{background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:10px; margin-bottom:9px;}
  .cat-head{display:flex; align-items:center; gap:8px; margin-bottom:8px;}
  .cat-head .cn{font-weight:600; font-size:15.8px; flex:1; cursor:pointer;}
  .cat-head button{background:none; border:none; color:var(--ink-dim); font-size:14px;}
  .cat-head button.del{color:var(--danger);}
  .add-cat-btn{width:100%; background:none; border:1px dashed var(--line); color:var(--ink-dim); border-radius:9px; padding:9px; font-size:15.2px;}

  /* ---- Player card ---- */
  .player-card{border:1px solid var(--line); border-left:3px solid var(--equip); border-radius:12px; margin-bottom:12px; overflow:hidden; background:var(--panel);}
  .player-head{width:100%; display:flex; align-items:center; gap:8px; background:none; border:none; padding:12px; text-align:left;}
  .player-head .pn{font-family:Georgia,serif; font-weight:700; font-size:18.1px; flex:1;}
  .player-body{display:none; padding:12px; background:var(--panel-alt);}
  .player-card.open .player-body{display:block;}
  .player-card.open .chev{transform:rotate(90deg);}
  .gold-row{display:flex; align-items:center; justify-content:space-between; padding:8px 2px; border-bottom:1px solid var(--line);}
  .gold-row:last-child{border-bottom:none;}
  .gold-stepper{display:flex; align-items:center; gap:5px;}
  .gold-btn{background:var(--panel-alt2); border:1px solid var(--line); color:var(--ink); border-radius:8px; padding:10px 12px; font-size:15px; font-family:monospace; min-height:40px;}
  .gold-num{font-family:monospace; font-size:17.5px; min-width:38px; text-align:center; font-weight:700; color:var(--inv); cursor:pointer;}

  /* ---- Shop / catalog cards ---- */
  .shop-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(120px,1fr)); gap:10px;}
  .shop-card{background:var(--panel); border:1px solid var(--line); border-left:3px solid var(--shop); border-radius:11px; padding:9px; display:flex; flex-direction:column; gap:7px;}
  .shop-card-photo{position:relative; width:100%; aspect-ratio:3/4; border-radius:8px; overflow:hidden; background:var(--panel-alt2);}
  .shop-card-photo img{width:100%; height:100%; object-fit:cover; cursor:pointer;}
  .shop-no-photo{width:100%; height:100%; display:flex; align-items:center; justify-content:center; color:var(--ink-dim); font-size:12.8px;}
  .shop-name{font-size:15.2px; font-weight:700; text-align:center;}
  .shop-badge{align-self:center; background:var(--panel-alt2); border:1px solid var(--line); color:var(--ink-dim); font-size:12.8px; padding:2px 8px; border-radius:10px;}
  .shop-actions{display:flex; gap:6px;}
  .shop-actions button{flex:1; border-radius:7px; padding:8px; font-size:14.6px; font-weight:700; border:none;}
  .shop-buy{background:var(--shop); color:#171D18;}
  .shop-buy:disabled{background:var(--panel-alt2); color:var(--ink-dim); font-weight:500;}
  .gm-inputs input, .gm-inputs select{width:100%; background:var(--panel-alt2); border:1px solid var(--line); border-radius:7px; padding:6px 8px; color:var(--ink); font-size:14.6px; outline:none; margin-bottom:5px;}
  .gm-del{position:absolute; top:4px; right:4px; width:30px; height:30px; border-radius:50%; background:rgba(10,13,10,0.8); border:none; color:var(--ink); font-size:16px;}
  .level-check{display:flex; align-items:center; gap:6px; font-size:15.2px; font-weight:700; margin-bottom:8px;}
  .level-check input{width:16px; height:16px; accent-color:var(--shop);}

  /* ---- Overlay / sheet ---- */
  .overlay{position:fixed; inset:0; background:rgba(10,13,10,.72); z-index:60; display:none; align-items:flex-end; justify-content:center;}
  .overlay.show{display:flex;}
  .sheet{background:var(--panel); width:100%; max-width:640px; border-radius:18px 18px 0 0; padding:16px 16px calc(16px + var(--safe-b)); max-height:88vh; overflow-y:auto;}
  .sheet2{background:var(--panel); width:100%; max-width:640px; border-radius:18px 18px 0 0; max-height:88vh; display:flex; flex-direction:column; overflow:hidden;}
  .sheet2-head{flex:0 0 auto; display:flex; justify-content:flex-end; padding:10px 12px 0;}
  .sheet2-close{background:var(--panel-alt2); border:1px solid var(--line); color:var(--ink); width:38px; height:38px; border-radius:50%; font-size:17px;}
  .sheet2-scroll{flex:1 1 auto; overflow-y:auto; padding:0 16px calc(16px + var(--safe-b));}
  .taglib-sticky{position:sticky; top:0; z-index:6; background:var(--panel); padding-top:4px; padding-bottom:8px;}
  .sheet h3{font-family:Georgia,serif; margin:0 0 12px;}
  .picker-list{display:flex; flex-wrap:wrap; gap:8px;}
  .picker-btn{background:var(--panel-alt2); border:1px solid var(--line); color:var(--ink); font-size:16.3px; padding:13px 16px; border-radius:10px; min-height:46px;}

  #lightbox{position:fixed; inset:0; background:rgba(6,8,6,.92); z-index:80; display:none; align-items:center; justify-content:center; padding:20px;}
  #lightbox.show{display:flex;}
  #lightbox img{max-width:100%; max-height:100%; border-radius:8px;}

  .toast{position:fixed; bottom:calc(72px + var(--safe-b)); left:50%; transform:translateX(-50%); background:var(--panel-alt2); border:1px solid var(--accent); color:var(--ink); padding:9px 16px; border-radius:20px; font-size:15.8px; z-index:90; opacity:0; pointer-events:none; transition:opacity .25s; max-width:88vw; text-align:center;}
  .toast.show{opacity:1;}

  #loadingCover{position:fixed; inset:0; background:var(--bg); z-index:999; display:flex; align-items:center; justify-content:center; color:var(--ink-dim); font-family:monospace; font-size:16.3px;}

  .taglib-item{padding:10px 4px; border-bottom:1px solid var(--line);}
  .ti-top{display:flex; align-items:center; justify-content:space-between; gap:8px;}
  .ti-name{font-size:16.9px; font-weight:700;}
  .ti-bottom{display:flex; gap:6px; margin-top:6px; flex-wrap:wrap;}
  .ti-badge{background:var(--panel-alt2); border:1px solid var(--line); color:var(--ink-dim); font-size:13.4px; padding:3px 8px; border-radius:10px;}
  .ti-action{background:var(--accent-soft); border:1px solid var(--accent); color:var(--accent); font-size:13.4px; padding:3px 9px; border-radius:10px; font-weight:700;}
  .ti-del{background:none; border:none; color:var(--danger); font-size:15px; padding:6px 8px; min-height:32px;}
  .cat-tabs{display:flex; gap:6px; overflow-x:auto; padding-bottom:6px; margin-bottom:8px;}
  .cat-tab{flex-shrink:0; background:var(--panel-alt2); border:1px solid var(--line); color:var(--ink-dim); font-size:14.6px; padding:10px 15px; border-radius:16px; white-space:nowrap; min-height:40px;}
  .cat-tab.active{background:var(--accent-soft); border-color:var(--accent); color:var(--accent); font-weight:700;}

  .quota-row{display:flex; justify-content:space-between; align-items:center; font-size:14.6px; margin-bottom:5px; gap:8px;}
  .quota-bar{height:7px; border-radius:4px; background:var(--panel-alt2); overflow:hidden;}
  .quota-bar-fill{height:100%; border-radius:4px; transition:width .3s;}
  .storage-row{display:flex; align-items:center; gap:8px; padding:8px 2px; border-bottom:1px solid var(--line);}
  .storage-row .lbl{flex:1; font-size:15.8px;}
  .storage-row .sz{font-family:monospace; font-size:14px; color:var(--ink-dim);}
</style>
</head>
<body>

<div id="loadingCover">載入存檔中…</div>

<div id="app">
  <div id="topbar">
    <button class="tb-btn" id="btnUndo" title="上一步" disabled>↶</button>
    <button class="tb-btn" id="btnRedo" title="下一步" disabled>↷</button>
    <button class="tb-btn" id="btnTagLib">🏷</button>
    <span class="tb-title" id="tbTitle">戰場</span>
    <span id="goldChip">💰 0</span>
  </div>

  <div id="main">
    <div class="tabpanel active" id="panel-battlefield"></div>
    <div class="tabpanel" id="panel-players"></div>
    <div class="tabpanel" id="panel-inventory"></div>
    <div class="tabpanel" id="panel-shop"></div>
    <div class="tabpanel" id="panel-gm"></div>
    <div class="tabpanel" id="panel-system"></div>
  </div>

  <button id="gmFab" title="新增卡牌">＋</button>

  <nav id="bottomnav">
    <button data-tab="battlefield" class="active" style="--tabc:var(--map)"><span class="dot"></span>戰場</button>
    <button data-tab="players" style="--tabc:var(--equip)"><span class="dot"></span>玩家</button>
    <button data-tab="inventory" style="--tabc:var(--inv)"><span class="dot"></span>團隊背包</button>
    <button data-tab="shop" style="--tabc:var(--shop)"><span class="dot"></span>商店系統</button>
    <button data-tab="gm" style="--tabc:var(--gm)"><span class="dot"></span>GM區</button>
    <button data-tab="system" style="--tabc:var(--accent)"><span class="dot"></span>系統</button>
  </nav>
</div>

<!-- Tag library overlay -->
<div class="overlay" id="taglibOverlay">
  <div class="sheet2">
    <div class="sheet2-head"><button class="sheet2-close" id="taglibCloseX">✕</button></div>
    <div class="sheet2-scroll" id="taglibBody"></div>
  </div>
</div>

<div id="lightbox"><img id="lightboxImg" alt=""></div>
<div class="toast" id="toast"></div>

<script>
/* ============ Utilities ============ */
const $ = s => document.querySelector(s);
const APP_VERSION = '1.4.2';
let latestKnownVersion = null;
async function checkForUpdate(showNoUpdateToast){
  try{
    const resp = await fetch('./version.json?t=' + Date.now(), { cache: 'no-store' });
    if(!resp.ok) throw new Error('no version.json');
    const data = await resp.json();
    latestKnownVersion = data.version;
    updateSystemVersionUI();
    if(data.version !== APP_VERSION){
      showToast(`⬆️ 發現新版本 v${data.version}（目前 v${APP_VERSION}），請到「系統」分頁更新`);
      return true;
    } else if(showNoUpdateToast){
      showToast('已經是最新版本');
    }
    return false;
  }catch(e){
    if(showNoUpdateToast) showToast('離線中，無法檢查更新');
    return false;
  }
}
function updateSystemVersionUI(){
  const el = $('#versionInfo');
  if(!el) return;
  const upToDate = latestKnownVersion===null || latestKnownVersion===APP_VERSION;
  el.innerHTML = upToDate
    ? `目前版本：v${APP_VERSION}（已是最新）`
    : `目前版本：v${APP_VERSION} · <span style="color:var(--danger); font-weight:700;">發現新版本 v${latestKnownVersion}</span>`;
}
async function forceUpdateNow(){
  showToast('更新中…');
  try{
    if('serviceWorker' in navigator){
      const regs = await navigator.serviceWorker.getRegistrations();
      for(const r of regs) await r.unregister();
    }
    if(window.caches){
      const names = await caches.keys();
      await Promise.all(names.map(n=>caches.delete(n)));
    }
  }catch(e){}
  location.reload();
}

const $$ = s => Array.from(document.querySelectorAll(s));
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtTime(ts){ const d=new Date(ts); const p=n=>String(n).padStart(2,'0'); return `${p(d.getMonth()+1)}/${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`; }
let toastTimer;
function showToast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'),2400); }
function compressImage(file, cb, maxW=1000, quality=0.75){
  if(!file) return;
  const reader = new FileReader();
  reader.onload = e=>{
    const img = new Image();
    img.onload = ()=>{
      const scale = Math.min(1, maxW/img.width);
      const canvas = document.createElement('canvas');
      canvas.width = img.width*scale; canvas.height = img.height*scale;
      canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);
      cb(canvas.toDataURL('image/jpeg', quality));
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}
function openLightbox(src){ $('#lightboxImg').src=src; $('#lightbox').classList.add('show'); }
$('#lightbox').addEventListener('click', ()=> $('#lightbox').classList.remove('show'));

/* ============ Storage backend: native window.storage (Claude) or localStorage (standalone) ============ */
const STORE_PREFIX = 'ttool-v1:';
const hasNativeStorage = (typeof window.storage !== 'undefined') && window.storage && typeof window.storage.get === 'function';
const appStorage = hasNativeStorage ? window.storage : {
  async get(key){ const raw=localStorage.getItem(STORE_PREFIX+key); if(raw===null) throw new Error('not found'); return {key,value:raw}; },
  async set(key,value){ localStorage.setItem(STORE_PREFIX+key,value); return {key,value}; },
  async delete(key){ localStorage.removeItem(STORE_PREFIX+key); return {key,deleted:true}; },
  async list(prefix){
    const ids=[]; const full=STORE_PREFIX+(prefix||'');
    for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); if(k&&k.startsWith(full)) ids.push(k.slice(full.length)); }
    return {keys:ids};
  },
};
async function safeGet(key){ try{ const r=await appStorage.get(key); return r?r.value:null; }catch(e){ return null; } }
async function listIds(prefix){ try{ const r=await appStorage.list(prefix); const keys=(r&&r.keys)?r.keys:[]; return keys.map(k=>k.startsWith(prefix)?k.slice(prefix.length):k); }catch(e){ return []; } }

function newPlayer(name){
  return {id:uid(), name, photos:[], note:'', hand:{tags:[]}, discard:{tags:[]}, skill:{tags:[]}, equipData:{}, collapsed:false, areaCollapsed:{}};
}
function sortCatsOtherLast(cats){ return [...cats].sort((a,b)=> (a.id==='other'?1:0) - (b.id==='other'?1:0)); }
function ensureCatData(map, catId){ if(!map[catId]) map[catId]={tags:[]}; return map[catId]; }
function ensureRemovedCatData(catId){ if(!state.teamInventory.removedCatData[catId]) state.teamInventory.removedCatData[catId]={cards:[]}; return state.teamInventory.removedCatData[catId]; }
function findMatchingCategory(categoryName){
  if(categoryName){ const m = state.globalCategories.find(c=>c.name===categoryName); if(m) return m; }
  return state.globalCategories.find(c=>c.id==='other') || state.globalCategories[0];
}
function addGlobalCategory(name){
  if(!name) return null;
  const existing = state.globalCategories.find(c=>c.name===name);
  if(existing) return existing;
  const cat = {id: name==='其他' ? 'other' : uid(), name};
  state.globalCategories.push(cat);
  return cat;
}

/* ============ Tag library core: cap, in-play counts, category routing ============ */
function renameInArr(arr, oldName, newName){
  if(!arr) return;
  for(let i=0;i<arr.length;i++){ if(arr[i]===oldName) arr[i]=newName; }
}
function renameTagEverywhere(oldName, newName){
  if(!newName || oldName===newName) return true;
  const dupe = state.tagLibrary.find(t=>t.name===newName);
  if(dupe){
    if(!confirm(`已經有標籤叫「${newName}」了。要把「${oldName}」合併進去嗎？（原本「${oldName}」的分類/等級/上限設定會被捨棄，場上已放置的紀錄則會改用「${newName}」）`)) return false;
  }
  state.players.forEach(p=>{
    renameInArr(p.hand.tags, oldName, newName);
    renameInArr(p.discard.tags, oldName, newName);
    renameInArr((p.skill&&p.skill.tags), oldName, newName);
    Object.values(p.equipData||{}).forEach(c=> renameInArr(c.tags, oldName, newName));
  });
  Object.values(state.teamInventory.catData||{}).forEach(c=> renameInArr(c.tags, oldName, newName));
  Object.values(state.teamInventory.removedCatData||{}).forEach(c=>{
    (c.cards||[]).forEach(r=>{ if(r.name===oldName) r.name=newName; });
  });
  [state.shopCatalog, state.skillCatalog, state.handCatalog].forEach(arr=>{
    arr.forEach(it=>{
      if(it.name===oldName) it.name=newName;
      if(it.linkedNames) it.linkedNames = it.linkedNames.map(n=> n===oldName?newName:n);
    });
  });
  state.tagLibrary.forEach(t=>{
    if(t.linkedNames) t.linkedNames = t.linkedNames.map(n=> n===oldName?newName:n);
  });
  const entry = state.tagLibrary.find(t=>t.name===oldName);
  if(entry){
    if(dupe){ state.tagLibrary = state.tagLibrary.filter(t=>t!==entry); }
    else { entry.name = newName; }
  }
  showToast(`已把「${oldName}」改名為「${newName}」，並同步更新所有位置`);
  return true;
}
function upsertTagLibrary(name, category, level, school, cap, linkedNames){
  let e = state.tagLibrary.find(t=>t.name===name);
  if(e){ e.category=category; e.level=level||''; e.school=school||''; if(cap!==undefined) e.cap=cap; if(linkedNames!==undefined) e.linkedNames=linkedNames; }
  else { e = {id:uid(), name, category, level:level||'', school:school||'', cap: cap===undefined?null:cap, linkedNames: linkedNames||[]}; state.tagLibrary.unshift(e); }
  return e;
}
function countInPlay(name){
  let n=0;
  state.players.forEach(p=>{
    n += (p.hand.tags||[]).filter(t=>t===name).length;
    n += (p.discard.tags||[]).filter(t=>t===name).length;
    n += ((p.skill&&p.skill.tags)||[]).filter(t=>t===name).length;
    Object.values(p.equipData||{}).forEach(c=> n += (c.tags||[]).filter(t=>t===name).length);
  });
  Object.values(state.teamInventory.catData||{}).forEach(c=> n += (c.tags||[]).filter(t=>t===name).length);
  return n;
}
function countRemoved(name){
  let n=0; Object.values(state.teamInventory.removedCatData).forEach(c=> n += c.cards.filter(r=>r.name===name).length);
  return n;
}
function inferCategoryForRemoval(tag, source){
  if(source && source.type==='player' && source.area!=='hand' && source.area!=='discard' && source.area!=='skill'){
    const c = state.globalCategories.find(c=>c.id===source.area);
    if(c) return c.name;
  }
  if(source && source.type==='team'){
    const c = state.globalCategories.find(c=>c.id===source.catId);
    if(c) return c.name;
  }
  const lib = state.tagLibrary.find(t=>t.name===tag);
  if(lib && lib.category) return lib.category;
  return '其他';
}
function getCardGroup(name){
  const group = new Set([name]);
  state.tagLibrary.forEach(t=>{
    if(t.name===name && Array.isArray(t.linkedNames)) t.linkedNames.forEach(n=>group.add(n));
    if(Array.isArray(t.linkedNames) && t.linkedNames.includes(name)) group.add(t.name);
  });
  return Array.from(group);
}
function getCap(name){
  const group = getCardGroup(name);
  for(const n of group){
    const e = state.tagLibrary.find(t=>t.name===n);
    if(e && e.cap!=null) return e.cap;
  }
  return null;
}
function canPlace(name){
  const cap = getCap(name); if(cap==null) return true;
  const group = getCardGroup(name);
  const used = group.reduce((s,n)=> s + countInPlay(n) + countRemoved(n), 0);
  return used < cap;
}
function placeTag(tag, dest){
  if(!canPlace(tag)){ showToast(`「${tag}」已達數量上限，無法再新增`); return false; }
  let arr;
  if(dest.type==='player'){
    const p = state.players.find(x=>x.id===dest.playerId); if(!p) return false;
    if(dest.area==='hand') arr=p.hand.tags;
    else if(dest.area==='discard') arr=p.discard.tags;
    else if(dest.area==='skill') arr=p.skill.tags;
    else arr = ensureCatData(p.equipData, dest.area).tags;
  } else {
    arr = ensureCatData(state.teamInventory.catData, dest.catId).tags;
  }
  if(!arr.includes(tag)) arr.push(tag);
  return true;
}
function removeTagFromSource(source, tag){
  if(!source) return;
  let arr;
  if(source.type==='player'){
    const p = state.players.find(x=>x.id===source.playerId); if(!p) return;
    if(source.area==='hand') arr=p.hand.tags;
    else if(source.area==='discard') arr=p.discard.tags;
    else if(source.area==='skill') arr=p.skill.tags;
    else arr = ensureCatData(p.equipData, source.area).tags;
  } else {
    arr = ensureCatData(state.teamInventory.catData, source.catId).tags;
  }
  const idx = arr.indexOf(tag); if(idx>=0) arr.splice(idx,1);
}
function levelSortKey(lv){
  if(!lv) return [0,0,''];
  const m = String(lv).match(/\d+/);
  return [1, m?parseInt(m[0],10):999999, String(lv)];
}
function compareTagEntries(a,b){
  const la=levelSortKey(a.level), lb=levelSortKey(b.level);
  if(la[0]!==lb[0]) return la[0]-lb[0];
  if(la[1]!==lb[1]) return la[1]-lb[1];
  if(la[2]!==lb[2]) return la[2].localeCompare(lb[2]);
  if(a.name.length!==b.name.length) return a.name.length-b.name.length;
  return a.name.localeCompare(b.name,'zh-Hant');
}

/* ============ Generic tag field + collapsible sections ============ */
function tagFieldHTML(loc, tags, defaultCategory){
  return `
  <div class="tagfield" data-loc="${loc}" data-defcat="${escapeHtml(defaultCategory||'')}">
    <div class="tag-chips">
      ${tags.length ? tags.map(t=>`<span class="tag-chip"><span class="tcn" data-tag="${escapeHtml(t)}">${escapeHtml(t)}</span><button class="tcx" data-tag="${escapeHtml(t)}">×</button></span>`).join('') : '<span class="tag-empty">尚無標籤</span>'}
    </div>
    <div class="tag-add-row">
      <input type="text" class="tf-input" placeholder="輸入或搜尋標籤…">
      <button class="tf-add" type="button">加入</button>
    </div>
    <div class="tag-suggest"></div>
  </div>`;
}
function resolveArr(loc){
  const parts = loc.split(':');
  if(parts[0]==='player'){
    const p = state.players.find(x=>x.id===parts[1]); if(!p) return null;
    if(parts[2]==='hand') return p.hand.tags;
    if(parts[2]==='discard') return p.discard.tags;
    if(parts[2]==='skill') return p.skill.tags;
    if(parts[2]==='equip'){ return ensureCatData(p.equipData, parts[3]).tags; }
  } else if(parts[0]==='team'){
    return ensureCatData(state.teamInventory.catData, parts[1]).tags;
  }
  return null;
}
function resolveScope(loc){
  const parts = loc.split(':');
  if(parts[0]==='player'){
    if(parts[2]==='equip') return {type:'player', playerId:parts[1], area:parts[3]};
    return {type:'player', playerId:parts[1], area:parts[2]};
  }
  return {type:'team', catId:parts[1]};
}
function addTagDirect(loc, name, defaultCategory){
  if(!name) return;
  if(!canPlace(name)){ showToast(`「${name}」已達數量上限，無法再新增`); return; }
  const arr = resolveArr(loc); if(!arr) return;
  if(!arr.includes(name)) arr.push(name);
  if(!state.tagLibrary.find(t=>t.name===name)) upsertTagLibrary(name, defaultCategory||'', '', '', null);
  markDirty(); rerenderActiveTab();
}
function rerenderActiveTab(){ if(RENDER_FN[activeTab]) RENDER_FN[activeTab](); }

function adjustGold(target, playerId, delta){
  if(target==='team') state.teamInventory.totalGold = Math.max(0,(state.teamInventory.totalGold||0)+delta);
  else state.teamInventory.playerGold[playerId] = Math.max(0,(state.teamInventory.playerGold[playerId]||0)+delta);
  markDirty(); rerenderActiveTab();
}
function setGoldExact(target, playerId){
  const cur = target==='team' ? (state.teamInventory.totalGold||0) : (state.teamInventory.playerGold[playerId]||0);
  const val = prompt('輸入金額：', cur); if(val===null) return;
  const num = parseInt(val,10); if(isNaN(num)) return;
  if(target==='team') state.teamInventory.totalGold = Math.max(0,num);
  else state.teamInventory.playerGold[playerId] = Math.max(0,num);
  markDirty(); rerenderActiveTab();
}

  }
  const areaToggle = ev.target.closest('.area-toggle');

  const rcDel = ev.target.closest('.rc-del');
  if(rcDel){

      const c = ensureRemovedCatData(rcDel.dataset.cid);

  if(area==='equip'){ realArea = findMatchingCategory(tagCategoryOf(picker.tag)).id; }
  const dest = {type:'player', playerId:picker.playerId, area:realArea};
  const ok = placeTag(picker.tag, dest); if(!ok) return;
  if(picker.mode==='move' && picker.source) removeTagFromSource(picker.source, picker.tag);
  markDirty();

function doGmReturn(giveGold){
  if(giveGold){
    const val = prompt(`「${picker.tag}」歸還後要給多少金幣？`, 0); if(val===null) return;
    const gold = parseInt(val,10); if(isNaN(gold)||gold<0){ showToast('請輸入有效金額'); return; }
    if(picker.source) removeTagFromSource(picker.source, picker.tag);
    state.teamInventory.totalGold += gold;
    markDirty(); showToast(`已歸還「${picker.tag}」給 GM，團隊金庫 +${gold}`);
  } else {

function doBuyToTeam(){
  const item = picker.shopItem;
  if(state.teamInventory.totalGold < (item.price||0)){ showToast('團隊金庫不足，無法購買'); return; }
  if(!canPlace(item.name)){ showToast(`「${item.name}」已達數量上限`); return; }
  const c = findMatchingCategory(item.category);
  const ok = placeTag(item.name, {type:'team', catId:c.id}); if(!ok) return;
  state.teamInventory.totalGold -= (item.price||0);
  markDirty(); showToast(`已購買「${item.name}」`); rerenderActiveTab(); closePicker();
}
function doBuyToPlayer(playerId){
  const item = picker.shopItem;
  if(state.teamInventory.totalGold < (item.price||0)){ showToast('團隊金庫不足，無法購買'); return; }
  if(!canPlace(item.name)){ showToast(`「${item.name}」已達數量上限`); return; }
  const p = state.players.find(x=>x.id===playerId);
  const c = findMatchingCategory(item.category);
  const ok = placeTag(item.name, {type:'player', playerId:p.id, area:c.id}); if(!ok) return;
  state.teamInventory.totalGold -= (item.price||0);
  markDirty(); showToast(`已購買「${item.name}」給 ${p.name}`); rerenderActiveTab(); closePicker();
}
function ensureShopListing(tagName, price){
  let item = state.shopCatalog.find(x=>x.name===tagName);
  if(item) return item; // 已經在商店總表裡了，保留 GM 原本設定的價格/等級，不覆蓋
  const lib = state.tagLibrary.find(t=>t.name===tagName);
  item = {id:uid(), name:tagName, category: (lib&&lib.category)?lib.category:'其他', level:'', price: price||0, cap: lib?lib.cap:null};
  state.shopCatalog.push(item);
  return item;
}
function sellTagFlow(tag, source){
  const val = prompt(`「${tag}」的賣出價格：`, 0); if(val===null) return;
  const price = parseInt(val,10); if(isNaN(price)||price<0){ showToast('請輸入有效金額'); return; }
  if(source) removeTagFromSource(source, tag);
  state.teamInventory.totalGold += price;
  const listing = ensureShopListing(tag, price);
  markDirty();
  showToast(`已賣出「${tag}」，團隊金庫 +${price}，已上架到商店「${listing.category}」分類`);
  rerenderActiveTab(); closePicker();
}
function removeAndShelve(tag, source){
  if(source) removeTagFromSource(source, tag);
  const listing = ensureShopListing(tag, 0);

  rerenderActiveTab(); closePicker();
}
function removeToDiscardPile(tag, source){
  const categoryName = inferCategoryForRemoval(tag, source);
  if(source) removeTagFromSource(source, tag);
  const gcat = findMatchingCategory(categoryName);
  const cat = ensureRemovedCatData(gcat.id);
  cat.cards.push({id:uid(), name:tag, removedAt:Date.now()});

function shopCardHTML(it){
  const cap = getCap(it.name);
  const group = getCardGroup(it.name);
  const used = group.reduce((s,n)=> s + countInPlay(n) + countRemoved(n), 0);
  const avail = cap!=null ? Math.max(0, cap-used) : null;

  const canAfford = state.teamInventory.totalGold >= (it.price||0);

  return `

    <div class="shop-actions"><button class="shop-buy" data-buy="${it.id}" ${canBuy?'':'disabled'}>${outOfStock?'已達上限':(!canAfford?'金庫不足':'購買')}</button></div>

function getCatalogArr(kind){ return kind==='shop'?state.shopCatalog:(kind==='skill'?state.skillCatalog:state.handCatalog); }
function syncCatalogItemToLibrary(kind, item){
  if(!item.name) return;
  const category = kind==='shop' ? (item.category||'') : (kind==='skill'?'技能':'手牌');
  upsertTagLibrary(item.name, category, item.level||'', kind==='shop'?'':(item.school||''), item.cap, item.linkedNames||[]);
}
function syncLinkedCounterpart(kind, item){
  const backName = (item.backName||'').trim();
  if(!backName || backName===item.name) return null;
  const arr = getCatalogArr(kind);
  let counterpart = arr.find(x=>x.name===backName);
  if(!counterpart){
    if(kind==='shop') counterpart = {id:uid(), name:backName, category:(item.backCategory||'').trim(), level:item.level||'', price:null, cap:null, linkedNames:[item.name]};
    else counterpart = {id:uid(), name:backName, school:item.school||'', level:item.level||'', cap:null, linkedNames:[item.name]};
    arr.push(counterpart);
  } else {
    if(kind==='shop' && (item.backCategory||'').trim()) counterpart.category = item.backCategory.trim();
    if(!counterpart.linkedNames) counterpart.linkedNames=[];
    if(!counterpart.linkedNames.includes(item.name)) counterpart.linkedNames.push(item.name);
  }
  if(!item.linkedNames) item.linkedNames=[];
  if(!item.linkedNames.includes(backName)) item.linkedNames.push(backName);
  syncCatalogItemToLibrary(kind, item);
  syncCatalogItemToLibrary(kind, counterpart);
  return counterpart;
}

/* ============ Snapshot / export / import ============ */
function captureSnapshot(){
  return JSON.parse(JSON.stringify({
    battlefield: state.battlefield, players: state.players, playerFilter: state.playerFilter,
    globalCategories: state.globalCategories,
    teamInventory: state.teamInventory, shopCatalog: state.shopCatalog, shopUnlockedLevels: state.shopUnlockedLevels,
    skillCatalog: state.skillCatalog, handCatalog: state.handCatalog, tagLibrary: state.tagLibrary,
  }));
}
function applySnapshot(snap){
  state.battlefield = snap.battlefield || {photos:[],note:''};
  state.playerFilter = snap.playerFilter || null;

  // ---- build/merge the global category list ----
  const nameToId = new Map();
  function regName(name){
    if(!name) name='其他';
    if(name==='其他分類') name='其他';
    if(!nameToId.has(name)) nameToId.set(name, name==='其他' ? 'other' : uid());
    return nameToId.get(name);
  }
  regName('其他');
  (snap.globalCategories||[]).forEach(c=>regName(c.name));
  (snap.players||[]).forEach(p=> (p.equipCats||[]).forEach(c=>regName(c.name)) );
  const oldTi = snap.teamInventory || {};
  (oldTi.cats||[]).forEach(c=>regName(c.name));
  (oldTi.removedCategories||[]).forEach(c=>regName(c.name));
  state.globalCategories = Array.from(nameToId.entries()).map(([name,id])=>({id,name}));

  // ---- players: migrate equipCats[] -> equipData{} keyed by global cat id ----
  state.players = (snap.players || []).map(p=>{
    const equipData = {};
    if(p.equipData){
      Object.keys(p.equipData).forEach(catId=>{ equipData[catId] = p.equipData[catId]; });
    }
    (p.equipCats||[]).forEach(c=>{
      const gid = regName(c.name);
      if(!equipData[gid]) equipData[gid] = {tags:[]};
      equipData[gid].tags = Array.from(new Set([...(equipData[gid].tags||[]), ...(c.tags||[])]));
    });
    return {
      id:p.id, name:p.name, photos:p.photos||[], note:p.note||'',
      hand: p.hand||{tags:[]}, discard: p.discard||{tags:[]}, skill: p.skill||{tags:[]},
      equipData, collapsed: !!p.collapsed, areaCollapsed: p.areaCollapsed||{},
    };
  });

  // ---- team inventory: migrate cats[]/removedCategories[] -> catData{}/removedCatData{} ----
  const catData = {};
  if(oldTi.catData) Object.assign(catData, oldTi.catData);
  (oldTi.cats||[]).forEach(c=>{
    const gid = regName(c.name);
    if(!catData[gid]) catData[gid] = {tags:[]};
    catData[gid].tags = Array.from(new Set([...(catData[gid].tags||[]), ...(c.tags||[])]));
  });
  const removedCatData = {};
  if(oldTi.removedCatData) Object.assign(removedCatData, oldTi.removedCatData);
  (oldTi.removedCategories||[]).forEach(c=>{
    const gid = regName(c.name);
    if(!removedCatData[gid]) removedCatData[gid] = {cards:[]};
    removedCatData[gid].cards = [...(removedCatData[gid].cards||[]), ...(c.cards||[])];
  });
  if(oldTi.removedCards && oldTi.removedCards.length){ // very old flat shape
    if(!removedCatData['other']) removedCatData['other'] = {cards:[]};
    removedCatData['other'].cards = [...removedCatData['other'].cards, ...oldTi.removedCards];
  }
  state.teamInventory = { totalGold: oldTi.totalGold||0, playerGold: oldTi.playerGold||{}, note: oldTi.note||'', catData, removedCatData };

  state.shopCatalog = snap.shopCatalog || [];
  state.shopUnlockedLevels = snap.shopUnlockedLevels || [];
  state.skillCatalog = snap.skillCatalog || [];
  state.handCatalog = snap.handCatalog || [];
  state.tagLibrary = snap.tagLibrary || [];
  rerenderActiveTab(); updateGoldChip();
}
/* ---------------- Excel bulk import (GM cards) ---------------- */
function downloadExcelTemplate(){
  const rows = [
    ['類型','名稱','分類','流派角色','等級','價格','數量上限','連動另一面名稱','連動另一面分類'],
    ['商店','飛彈魔杖','武器','','日常等級','50','1','神奇護甲','護甲'],
    ['技能','火球術','','火系流派','1','','3','',''],
    ['手牌','揮劍攻擊','','戰士','1','','2','',''],
  ];
  const csv = rows.map(r=>r.map(cell=>{
    const s = String(cell);
    return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
  }).join(',')).join('\r\n');
  const blob = new Blob(['\uFEFF'+csv], {type:'text/csv;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href=url; a.download='卡牌匯入範例.csv';
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  showToast('已下載範例，可用 Excel 打開編輯後另存為 .xlsx 再匯入');
}
function ensureXLSXLoaded(){
  if(window.XLSX) return Promise.resolve(true);
  return new Promise((resolve, reject)=>{
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    s.onload = ()=> resolve(true);
    s.onerror = ()=> reject(new Error('load failed'));
    document.head.appendChild(s);
  });
}
function parseExcelRows(rows){
  const added = {shop:0, skill:0, hand:0};
  const linkedRows = [];
  rows.forEach(row=>{
    const type = String(row['類型']||'').trim();
    const name = String(row['名稱']||'').trim();
    if(!name) return;
    const level = String(row['等級']||'').trim();
    const capRaw = row['數量上限'];
    const cap = (capRaw===undefined || capRaw==='' || capRaw===null) ? null : Math.max(0, parseInt(capRaw,10)||0);
    const backName = String(row['連動另一面名稱']||'').trim();
    const backCategory = String(row['連動另一面分類']||'').trim();
    let kind;
    if(type==='商店') kind='shop';
    else if(type==='技能') kind='skill';
    else if(type==='手牌') kind='hand';
    else return;

    const arr = getCatalogArr(kind);
    let item = arr.find(x=>x.name===name);
    if(kind==='shop'){
      const category = String(row['分類']||'').trim();
      const priceRaw = row['價格'];
      const price = (priceRaw===undefined || priceRaw==='' || priceRaw===null) ? null : Math.max(0, parseInt(priceRaw,10)||0);
      if(!item){ item = {id:uid(), name, category, level, price, cap, linkedNames:[]}; arr.push(item); added.shop++; }
      else { item.category = category||item.category; item.level = level||item.level; if(price!=null) item.price=price; if(cap!=null) item.cap=cap; }
    } else {
      const school = String(row['流派角色']||'').trim();
      if(!item){ item = {id:uid(), name, school, level, cap, linkedNames:[]}; arr.push(item); added[kind]++; }
      else { item.school = school||item.school; item.level = level||item.level; if(cap!=null) item.cap=cap; }
    }
    syncCatalogItemToLibrary(kind, item);
    if(backName){ item.backName = backName; item.backCategory = backCategory; linkedRows.push({kind, item}); }
  });
  // second pass: create/update counterparts now that all explicit rows exist,
  // reusing the same logic as the GM in-app "背面名稱/背面分類" fields
  linkedRows.forEach(({kind, item}) => { syncLinkedCounterpart(kind, item); });
  return added;
}
async function handleExcelImport(file){
  const statusEl = $('#excelStatus');
  if(statusEl) statusEl.textContent = '讀取中…';
  try{
    await ensureXLSXLoaded();
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, {type:'array'});
    const sheet = wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(sheet, {defval:''});
    const added = parseExcelRows(rows);
    markDirty();
    if(activeTab==='gm') renderGM();
    const msg = `匯入完成：商店 +${added.shop}、技能 +${added.skill}、手牌 +${added.hand}`;
    if(statusEl) statusEl.textContent = msg;
    showToast(msg);
  }catch(e){
    console.error(e);
    const msg = '匯入失敗，請確認檔案格式是否正確，或檢查網路連線（第一次匯入需要下載 Excel 解析套件）';
    if(statusEl) statusEl.textContent = msg;
    showToast(msg);
  }
}

function doExport(){
  const payload = { type:'ttrpg-tracker-save', version:1, savedAt:Date.now(), ...captureSnapshot() };
  const blob = new Blob([JSON.stringify(payload)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); const d=new Date(); const p=n=>String(n).padStart(2,'0');
  a.href=url; a.download=`遊戲存檔_${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}.json`;
  document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
  markClean(); updateStatusHint(); showToast('已匯出存檔');
}
function onImportFile(e){
  const file = e.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = ev=>{
    try{
      const data = JSON.parse(ev.target.result);
      if(data.type!=='ttrpg-tracker-save') throw new Error('bad file');
      const proceed = (!state.players.length && !state.shopCatalog.length) || confirm('讀檔會覆蓋目前尚未匯出的內容，確定要繼續嗎？');
      if(!proceed) return;
      applySnapshot(data); markClean(); updateStatusHint(); showToast('讀檔成功');
    }catch(err){ showToast('讀取失敗，請確認是正確的存檔檔案'); }
  };
  reader.readAsText(file); e.target.value='';
}

/* ============ Undo / redo ============ */
let undoStack=[]; let redoStack=[]; let isRestoringHistory=false; let historyTimer=null;
function scheduleHistoryPush(){
  if(isRestoringHistory) return;
  clearTimeout(historyTimer);
  historyTimer = setTimeout(()=>{
    undoStack.push(JSON.stringify(captureSnapshot()));
    if(undoStack.length>30) undoStack.shift();
    redoStack=[]; updateUndoRedoButtons();
  }, 1000);
}
function updateUndoRedoButtons(){ $('#btnUndo').disabled = undoStack.length<2; $('#btnRedo').disabled = redoStack.length<1; }
function doUndo(){
  if(undoStack.length<2){ showToast('沒有更早的步驟了'); return; }
  isRestoringHistory=true;
  const cur = undoStack.pop(); redoStack.push(cur);
  applySnapshot(JSON.parse(undoStack[undoStack.length-1]));
  isRestoringHistory=false; updateUndoRedoButtons(); showToast('已回到上一步');
}
function doRedo(){
  if(!redoStack.length){ showToast('沒有下一步了'); return; }
  isRestoringHistory=true;
  const next = redoStack.pop(); undoStack.push(next);
  applySnapshot(JSON.parse(next));
  isRestoringHistory=false; updateUndoRedoButtons(); showToast('已重做');
}
$('#btnUndo').addEventListener('click', doUndo);
$('#btnRedo').addEventListener('click', doRedo);

/* ============ Persistence: per-photo storage, orphan pruning, quota checks ============ */
let autoSaveTimer=null;
function scheduleAutoSave(){ clearTimeout(autoSaveTimer); autoSaveTimer=setTimeout(flushAutoSaveNow, 700); }
function flushAutoSaveNow(){ clearTimeout(autoSaveTimer); persistCurrentState(); }
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='hidden') flushAutoSaveNow(); });
window.addEventListener('pagehide', flushAutoSaveNow);

function stripPhotos(arr){ return arr.map(({photo,...r})=>r); }
let persistedPhotoIds = new Set();
async function forgetPhoto(id){ persistedPhotoIds.delete(id); try{ await appStorage.delete('photo:'+id, false); }catch(e){} }
async function persistCatalogPhotos(arr){
  let ok=true;
  for(const it of arr){ if(!it.photo || persistedPhotoIds.has(it.id)) continue; try{ await appStorage.set('photo:'+it.id, it.photo, false); persistedPhotoIds.add(it.id); }catch(e){ ok=false; } }
  return ok;
}
async function pruneOrphanedPhotos(){
  const validIds = new Set([...state.shopCatalog.map(i=>i.id), ...state.skillCatalog.map(i=>i.id), ...state.handCatalog.map(i=>i.id)]);
  const ids = await listIds('photo:');
  for(const id of ids){ if(!validIds.has(id)){ try{ await appStorage.delete('photo:'+id, false); }catch(e){} persistedPhotoIds.delete(id); } }
}
let lastQuotaWarnAt=0;
function checkQuotaWarning(){
  if(hasNativeStorage) return;
  const ratio = estimateLocalUsage()/LOCAL_CAP; if(ratio<0.8) return;
  const now=Date.now(); if(now-lastQuotaWarnAt<5*60*1000) return; lastQuotaWarnAt=now;
  showToast(`⚠️ 裝置儲存空間約用了 ${Math.round(ratio*100)}%，建議盡快匯出備份並清除舊照片`);
}
async function persistCurrentState(){
  const snap = captureSnapshot();
  const { shopCatalog, skillCatalog, handCatalog, ...core } = snap;
  const fails=[];
  const parts = [['core',core,'其他資料'],['shopmeta',stripPhotos(shopCatalog),'商店卡牌'],['skillmeta',stripPhotos(skillCatalog),'技能卡牌'],['handmeta',stripPhotos(handCatalog),'手牌']];
  for(const [k,v,label] of parts){ try{ await appStorage.set(k, JSON.stringify(v), false); }catch(e){ fails.push(label); } }
  const photoOk = await Promise.all([persistCatalogPhotos(state.shopCatalog), persistCatalogPhotos(state.skillCatalog), persistCatalogPhotos(state.handCatalog)]);
  if(photoOk.some(o=>!o)) fails.push('卡牌圖片（單張過大）');
  if(fails.length) showToast(`「${[...new Set(fails)].join('、')}」自動保存失敗，建議清除或先手動匯出備份`);
  await pruneOrphanedPhotos();
  checkQuotaWarning();
  updateStatusHint();
}
async function attachPhotos(arr){ await Promise.all(arr.map(async it=>{ const v=await safeGet('photo:'+it.id); if(v){ it.photo=v; persistedPhotoIds.add(it.id); } })); }

/* ============ Boot ============ */
async function initApp(){
  try{
    const coreVal = await safeGet('core');
    if(coreVal){
      const snap = JSON.parse(coreVal);
      const shopMeta = await safeGet('shopmeta'); const skillMeta = await safeGet('skillmeta'); const handMeta = await safeGet('handmeta');
      snap.shopCatalog = shopMeta?JSON.parse(shopMeta):[];
      snap.skillCatalog = skillMeta?JSON.parse(skillMeta):[];
      snap.handCatalog = handMeta?JSON.parse(handMeta):[];
      await attachPhotos(snap.shopCatalog); await attachPhotos(snap.skillCatalog); await attachPhotos(snap.handCatalog);
      applySnapshot(snap); markClean();
    }
  }catch(e){ /* 尚無存檔 */ }
  undoStack=[JSON.stringify(captureSnapshot())]; redoStack=[]; updateUndoRedoButtons();
  setActiveTab('battlefield');
  updateGoldChip();
  const cover=document.getElementById('loadingCover'); if(cover) cover.remove();
  pruneOrphanedPhotos();
  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('sw.js').then(reg=>{
      reg.addEventListener('updatefound', ()=>{
        const nw = reg.installing;
        if(!nw) return;
        nw.addEventListener('statechange', ()=>{
          if(nw.state==='installed' && navigator.serviceWorker.controller) checkForUpdate(false);
        });
      });
    }).catch(()=>{});
  }
  checkForUpdate(false);
  document.addEventListener('visibilitychange', ()=>{
    if(document.visibilityState==='visible'){
      checkForUpdate(false);
      if('serviceWorker' in navigator && navigator.serviceWorker.getRegistration){
        navigator.serviceWorker.getRegistration().then(reg=> reg && reg.update());
      }
    }
  });
}
initApp();
</script>
